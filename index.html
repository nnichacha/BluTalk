.world-deco svg{width:100%;height:100%}
.world-card{border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--card-line);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 30%,var(--line)),var(--sh-1)}
.world-card-top{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:color-mix(in srgb,var(--c) 17%,var(--surface));text-align:left}
.world-card-top .world-t{flex:1}
.world-peek{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;scrollbar-width:none}
.world-peek::-webkit-scrollbar{display:none}
.world-peek button{flex:none;min-height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:650}
/* search results */
.jumps{display:flex;flex-direction:column;gap:6px}
.jump{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--sh-1);text-align:left}
.jump .ic-tile{flex:none}
.jump>span:last-child{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.jump>span:last-child b{flex:1;font-size:14px}
.jump small{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent-text)}
.best{border-radius:20px;background:var(--grad-brand);color:var(--on-pastel);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 0 color-mix(in srgb,var(--brand) 35%,var(--line)),var(--sh-1)}
.best-main{display:flex;flex-direction:column;gap:4px;text-align:left;color:inherit}
.best-en{font-size:20px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.best-th{font-size:14.5px;color:var(--on-pastel-2)}
.best .row-meta{color:var(--on-pastel-2)}
.best-act{display:flex;gap:8px;align-items:center}
.best .icon-btn{background:var(--surface);color:var(--brand-text)}
.best .pill-btn{margin-left:auto;background:var(--accent);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
/* progressive reveal */
.reveal{display:flex;flex-direction:column;gap:8px}
.reveal-btn{align-self:stretch;border-radius:14px;background:var(--surface-2);color:var(--ink);font-weight:700}
.pop-in{animation:popIn .28s var(--ease) both}
@keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop-in{animation:none}}

/* =====================================================================
   v13 · Editorial calm: warm grey paper, ink, pastel blue / sand / grey
   serif display titles · thin borders · one deep-ink CTA
   ===================================================================== */
:root{
  --bg:#F2F0ED; --surface:#FBFAF8; --surface-2:#ECE9E5; --ink:#1B1C24; --ink-2:#55524D; --ink-3:#8D8882;
  --line:#E2DED8; --card-line:#E2DED8;
  --brand:#8FA9CC; --brand-soft:#DFE7F2; --brand-text:#34496B; --press-blue:#6E87AA;
  --accent:#A57A57; --accent-soft:#EEE3D7; --accent-text:#7A5234;
  --cta-bg:#1D2033; --cta-ink:#FFFFFF; --cta-press:#0B0C14;
  --grad-brand:#FBFAF8; --grad-ai:#DFE7F2; --grad-peach:#ECE9E5; --grad-mint:#8FA9CC; --grad-prog:#A57A57;
  --on-pastel:#1B1C24; --on-pastel-2:#6B6760; --ring-track:#E6E2DC;
  --pb:#DDE6F1; --ps:#ECE1D5; --pg:#E7E4E0;
  --serif:'DM Serif Display','Noto Sans Thai Looped',Georgia,serif;
  --sh-1:0 1px 0 rgba(27,28,36,.02); --sh-2:0 10px 30px -18px rgba(27,28,36,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131315; --surface:#1C1C1F; --surface-2:#26262A; --ink:#F3F0EB; --ink-2:#C2BDB6; --ink-3:#8C8780; --line:#2F2E32; --card-line:#2F2E32;
  --brand:#8FA9CC; --brand-soft:#243042; --brand-text:#B7CBE7; --accent:#C59B78; --accent-soft:#33291F; --accent-text:#DDB797;
  --cta-bg:#F3F0EB; --cta-ink:#1B1C24; --cta-press:#9D978F;
  --grad-brand:#1C1C1F; --grad-ai:#243042; --grad-peach:#26262A; --on-pastel:#F3F0EB; --on-pastel-2:#B0AAA2; --ring-track:#2F2E32;
  --pb:#223043; --ps:#342A21; --pg:#2A2A2E;
}}
:root[data-theme="dark"]{
  --bg:#131315; --surface:#1C1C1F; --surface-2:#26262A; --ink:#F3F0EB; --ink-2:#C2BDB6; --ink-3:#8C8780; --line:#2F2E32; --card-line:#2F2E32;
  --brand:#8FA9CC; --brand-soft:#243042; --brand-text:#B7CBE7; --accent:#C59B78; --accent-soft:#33291F; --accent-text:#DDB797;
  --cta-bg:#F3F0EB; --cta-ink:#1B1C24; --cta-press:#9D978F;
  --grad-brand:#1C1C1F; --grad-ai:#243042; --grad-peach:#26262A; --on-pastel:#F3F0EB; --on-pastel-2:#B0AAA2; --ring-track:#2F2E32;
  --pb:#223043; --ps:#342A21; --pg:#2A2A2E;
}
body{background:var(--bg)}
/* type: serif display for big titles only */
.t-hero,.t-page,.brand,.potd-en,.summary .t-page,.world-t b,.best-en,.cat-hero .t-page,.step-intro h2{font-family:var(--serif);font-weight:400;letter-spacing:-.005em}
.t-hero{font-size:34px;line-height:1.1}.t-page{font-size:30px;line-height:1.12}
.brand{font-size:22px}.brand-mark{background:var(--cta-bg);color:var(--cta-ink);font-family:var(--serif);font-weight:400;border-radius:50%}
.step-intro h2{font-size:24px}
.world-t b{font-size:20px;line-height:1.1}
.eyebrow{color:var(--ink-2);letter-spacing:.14em;font-weight:700}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
/* surfaces: paper cards, thin border, generous radius */
.card,.list,.feat,.mail,.jump,.world-card,.q-card,.stage,.target,.pcard,.hero,.tile,.cat-tile,.mode-tile,.eb-opt,.ask-field,.ladder-step,section>.ba{background:var(--surface);border:1px solid var(--line);box-shadow:none}
.list,.card,.feat,.world-card,.mail{border-radius:24px}
.tile,.cat-tile,.mode-tile{border-radius:20px}
.tile:active,.cat-tile:active,.mode-tile:active{transform:scale(.98);box-shadow:none}
.feat::before{display:none}
.feat .eyebrow{color:var(--ink-2)}
/* icons: quiet grey tiles with ink glyphs (like the reference) */
.ic-tile.hue,.ic-tile.solid,.ic-tile.brand,.ic-tile.accent{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.ic-tile.good{background:var(--cta-bg);color:var(--cta-ink);border:0}
/* the one standout: deep ink CTA */
.btn{border-radius:16px}
.btn-accent,.hero .btn-accent{background:var(--cta-bg);color:var(--cta-ink);box-shadow:none;min-height:54px}
.btn-accent:active:not(:disabled){transform:scale(.985);box-shadow:none}
.btn-accent svg{color:var(--cta-ink)}
.btn-soft{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-primary{background:var(--cta-bg);color:var(--cta-ink);box-shadow:none}
.pill-btn{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.pill-btn.plain{background:transparent}
.send-btn,.mic{background:var(--cta-bg);color:var(--cta-ink);box-shadow:none}
/* today card: paper, pastel slot, ink ring */
.hero{color:var(--ink);border-radius:28px}
.hero::after{display:none}
.hero .eyebrow{color:var(--ink-2)}
.hero-frame{color:var(--ink);font-family:var(--serif);font-weight:400;font-size:28px}
.hero-th,.hero .journey-mini,.hero .journey-mini span,.hero .dots span{color:var(--ink-3)!important}
.hero .journey-mini b{color:var(--ink)!important}
.slot,.hero .slot,.pcard .slot{background:var(--pb);color:var(--brand-text);border:0}
.slot.filled,.pcard .slot.filled{background:var(--brand-text);color:#fff}
.hero .ring .fill,.ring .fill{stroke:var(--ink)}
.dots i{background:var(--surface-2)}.dots i.on{background:var(--ink);box-shadow:none}.dots i.next{box-shadow:inset 0 0 0 2px var(--ink)}
.plan-chip,.hero .plan-chip{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.plan-chip small{color:var(--accent-text)}
/* lesson pattern card */
.pcard{border-radius:26px}
.pcard .pattern-big{font-family:var(--serif);font-weight:400;color:var(--ink)}
.pcard .eyebrow{color:var(--ink-2)}
.stepper i.done{background:var(--ink)}.stepper i.cur{background:var(--brand)}
.step-label em{color:var(--accent-text)}
/* category heroes: soft pastel wash of their own hue */
.cat-hero{background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid var(--line);border-radius:26px}
.cat-hero .ic-tile.solid{background:var(--surface)}
.cat-hero .path span{background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.cat-hero .path i{background:var(--ink);color:var(--surface)}
/* worlds: blue · sand · grey · ink */
.world{border-radius:24px;border:1px solid var(--line);box-shadow:none;min-height:150px}
.world:active{transform:scale(.98);box-shadow:none}
.world[data-push="world:talk"]{background:var(--pb)}
.world[data-push="world:out"]{background:var(--ps)}
.world[data-push="world:work"]{background:var(--pg)}
.world[data-push="world:build"]{background:var(--cta-bg);border-color:var(--cta-bg)}
.world[data-push="world:build"] .world-t b{color:var(--cta-ink)}
.world[data-push="world:build"] .world-t span{color:color-mix(in srgb,var(--cta-ink) 70%,transparent)}
.world[data-push="world:build"] .world-ic{background:color-mix(in srgb,var(--cta-ink) 12%,transparent);color:var(--cta-ink);border-color:transparent}
.world[data-push="world:build"] .world-deco{color:var(--cta-ink)}
.world-ic{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.world-deco{color:var(--ink);opacity:.07}
.world-card{box-shadow:none}
.world-card-top{background:var(--surface)}
.world-card:nth-child(1) .world-card-top{background:var(--pb)}.world-card:nth-child(2) .world-card-top{background:var(--ps)}.world-card:nth-child(3) .world-card-top{background:var(--pg)}
.world-card:nth-child(4) .world-card-top{background:var(--cta-bg)}.world-card:nth-child(4) .world-t b,.world-card:nth-child(4) .chev{color:var(--cta-ink)}.world-card:nth-child(4) .world-t span{color:color-mix(in srgb,var(--cta-ink) 70%,transparent)}
.world-card:nth-child(4) .world-ic{background:color-mix(in srgb,var(--cta-ink) 12%,transparent);color:var(--cta-ink);border-color:transparent}
.world-peek button{background:var(--surface-2);border:1px solid var(--line)}
/* ask */
.ask-field{border-radius:18px;min-height:56px}
.ask-field svg{color:var(--ink)}
.ask-chips button{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
/* phrase of the day: grey promo card like "SHORT DRAMAS" */
.potd{background:var(--pg);border:1px solid var(--line);border-radius:26px}
.potd-en{font-size:30px;line-height:1.15}
.potd .eyebrow{color:var(--ink-2)}
.potd-deco{color:var(--ink);opacity:.06}
/* search best match */
.best{background:var(--pb);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.best-th,.best .row-meta{color:var(--ink-2)}
.best-en{font-size:26px}
.best .icon-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.best .pill-btn{background:var(--cta-bg);color:var(--cta-ink);border:0;box-shadow:none}
.jump small{background:var(--surface-2);color:var(--ink-2)}
/* chips & choices */
.chip{background:var(--surface);border:1px solid var(--line);box-shadow:none}
.chip.sel{background:var(--cta-bg);color:var(--cta-ink);border-color:var(--cta-bg)}.chip.sel small{color:color-mix(in srgb,var(--cta-ink) 70%,transparent)}
.tone-chip.on{background:var(--cta-bg);border-color:var(--cta-bg);color:var(--cta-ink)}
.eb-opt.on{border-color:var(--ink);background:var(--pb);box-shadow:none}
.eb-opt.on small{color:var(--brand-text)}
.opt{background:var(--surface);border:1px solid var(--line);box-shadow:none}
.nav{background:color-mix(in srgb,var(--bg) 90%,transparent);border-top:1px solid var(--line)}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{background:var(--surface-2)}
.nav button[data-go="ai"] .ic{background:var(--cta-bg);color:var(--cta-ink);box-shadow:none}
.reveal-btn{background:var(--surface);border:1px solid var(--line)}
.bar{background:var(--surface-2)}.bar i,.e-home-bar i,.tile-prog i{background:var(--ink)}
.e-home .ic-tile.solid,.e-banner .ic-tile.solid{background:var(--surface-2);color:var(--ink)}
.e-banner{background:var(--pb)}
.e-tip{background:var(--ps);color:var(--ink)}
.levelup{background:var(--ink);color:var(--surface)}
.me .m-bubble{background:var(--cta-bg);color:var(--cta-ink);box-shadow:none}
.me .avatar{background:var(--cta-bg);color:var(--cta-ink)}
.streak,.avatar-btn{background:var(--surface);border:1px solid var(--line);box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-accent svg{color:var(--cta-ink)}}
:root[data-theme="dark"] .btn-accent svg{color:var(--cta-ink)}
.cat-hero .path span{border-radius:999px;padding:3px 9px 3px 4px}.cat-hero .path .sep{background:none!important;border:0!important;padding:0;color:var(--ink-3)}
.bk-in{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;font-size:13px;resize:vertical}
.brand-logo{width:32px;height:32px;border-radius:10px;display:block;box-shadow:0 1px 0 var(--line)}
/* v14 · simple search */
.how{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:18px;background:var(--pb);border:1px solid var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.55}
.how b{color:var(--ink);font-size:14.5px}
.res-head{font-size:14px;font-weight:700;color:var(--ink-2);margin:0}
.res-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.res{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:12px 4px 12px 16px;text-align:left}
.res-en{font-size:16px;font-weight:700;line-height:1.35;color:var(--ink)}
.res-th{font-size:13.5px;color:var(--ink-2)}
.res.top{background:var(--pb)}
.res.top .res-main{padding-top:14px;padding-bottom:16px}
.res.top .res-en{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2}
.res.top .icon-btn{background:var(--surface);border:1px solid var(--line);width:44px;height:44px}
.res-tag{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--cta-bg);color:var(--cta-ink);margin-bottom:4px}
.res-more{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:12px 16px;border-radius:16px;border:1px dashed var(--line);font-size:13.5px;color:var(--ink-2);text-align:left}
.res-more b{color:var(--ink)}
.snd{color:var(--ink-3)}.snd.on{color:var(--cta-ink);background:var(--cta-bg)}.o-head .snd{flex:none;margin-left:4px}.top-actions .snd{width:36px;height:36px;border:1px solid var(--line);background:var(--surface)}.top-actions .snd.on{background:var(--cta-bg);border-color:var(--cta-bg)}

/* =====================================================================
   v15 · AI Conversation — choose → situation → style → chat
   ===================================================================== */
.ai-page{--blu:#34568B;--blu-soft:#E4ECF8;--rose:#C0708A;--rose-soft:#F7E6EC;gap:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ai-page{--blu:#8FB0E0;--blu-soft:#1F2C42;--rose:#E3A2B6;--rose-soft:#3A2630}}
:root[data-theme="dark"] .ai-page{--blu:#8FB0E0;--blu-soft:#1F2C42;--rose:#E3A2B6;--rose-soft:#3A2630}
.ai-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ai-head .t-page{font-size:27px;margin:0}
.ai-head .sub{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.ai-art{width:78px;height:58px;flex:none}
.ai-steps{display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:8px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink-3);overflow:hidden}
.ai-steps li{display:flex;align-items:center;gap:4px;white-space:nowrap;font-weight:600}
.ai-steps li b{font-size:10.5px;font-weight:800;letter-spacing:.02em}
.ai-steps li.sep{color:var(--line);font-weight:400;flex:1;justify-content:center}
.ai-steps li.cur{color:var(--blu)}
.ai-steps li.cur b{background:var(--blu);color:#fff;border-radius:6px;padding:1px 5px}
.ai-steps li.done{color:var(--ink)}
.ai-sec{display:flex;flex-direction:column;gap:10px;animation:popIn .26s var(--ease) both}
.ai-sec-h{display:flex;align-items:center;gap:10px}
.ai-sec-h h2{margin:0;font-size:19px;font-weight:750;letter-spacing:-.01em;color:var(--ink)}
.ai-sec-h p{margin:1px 0 0;font-size:12.5px;color:var(--ink-3)}
.ai-n{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:800}
.ai-n.ok{background:var(--blu);color:#fff}.ai-n svg{width:14px;height:14px}
/* category cards */
.ai-cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai-cat{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:112px;padding:13px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 1px 2px rgba(27,28,36,.04),0 6px 16px -12px rgba(27,28,36,.18);text-align:left;transition:transform .15s var(--ease),border-color .2s,background .2s,box-shadow .2s}
.ai-cat:last-child:nth-child(odd){grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.ai-cat:last-child:nth-child(odd) .ai-ic{margin:0}
.ai-cat b{font-size:16px;font-weight:750;color:var(--ink);letter-spacing:-.01em}
.ai-cat span:last-child{font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.ai-cat:active,.ai-sub:active{transform:scale(.97);border-color:var(--blu);background:var(--blu-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--blu) 18%,transparent)}
.ai-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--surface-2);color:var(--ink);margin-bottom:6px;flex:none;transition:background .2s,color .2s}
.ai-ic svg{width:20px;height:20px}.ai-ic.sm{width:34px;height:34px;border-radius:11px;margin:0}.ai-ic.sm svg{width:18px;height:18px}
.ai-cat.rose .ai-ic,.ai-sub.rose .ai-ic{background:var(--rose-soft);color:var(--rose)}
.ai-cat:hover .ai-ic{background:var(--blu-soft);color:var(--blu)}
/* situations */
.ai-subs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ai-sub{display:flex;align-items:center;gap:10px;padding:11px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:left;box-shadow:0 1px 2px rgba(27,28,36,.04);transition:transform .15s var(--ease),border-color .2s,background .2s}
.ai-sub-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.ai-sub-t b{font-size:14.5px;font-weight:700;line-height:1.25;color:var(--ink)}
.ai-sub-t small{font-size:11.5px;line-height:1.3;color:var(--ink-3)}
/* completed step row */
.ai-done{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:16px;background:var(--blu-soft);border:1.5px solid color-mix(in srgb,var(--blu) 55%,transparent);text-align:left;animation:popIn .22s var(--ease) both}
.ai-done-t{flex:1;display:flex;flex-direction:column;min-width:0}
.ai-done-t small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ai-done-t b{font-size:15px;color:var(--ink)}

/* buttons get the blue */

/* v17b · same fun layout, BluTalk palette: brown · blue · grey · ink, icons not emoji */
:root{--blu:#34496B;--blu-soft:#DFE7F2;--rose:#A57A57;--rose-soft:#EEE3D7;--sun:#6B6760;--sun-soft:#E7E4E0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blu:#B7CBE7;--blu-soft:#243042;--rose:#DDB797;--rose-soft:#33291F;--sun:#C2BDB6;--sun-soft:#2A2A2E}}
:root[data-theme="dark"]{--blu:#B7CBE7;--blu-soft:#243042;--rose:#DDB797;--rose-soft:#33291F;--sun:#C2BDB6;--sun-soft:#2A2A2E}
.f-hello{font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:-.01em}
.f-head .t-page{font-weight:400}
.act-e{color:var(--ink)}.act-e svg{width:22px;height:22px}
.act.t-b .act-e{background:var(--blu-soft);color:var(--blu)}.act.t-p .act-e{background:var(--rose-soft);color:var(--rose)}.act.t-y .act-e{background:var(--sun-soft);color:var(--ink)}
.acts.big .act-e svg{width:24px;height:24px}
.talk{background:var(--cta-bg);box-shadow:0 18px 36px -20px rgba(29,32,51,.8)}
.talk-t b{font-family:var(--serif);font-weight:400;font-size:26px}
.talk-go{background:rgba(255,255,255,.14)}
.f-pill svg{width:16px;height:16px;color:var(--rose)}
.cont::before{content:"Continue";background:var(--rose-soft);color:var(--rose)}
.x-e{color:var(--ink)}.x-e svg{width:18px;height:18px}
.s3 span{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--surface-2);color:var(--ink)}.s3 span svg{width:20px;height:20px}
.s3:nth-child(1) span{background:var(--rose-soft);color:var(--rose)}.s3:nth-child(2) span{background:var(--blu-soft);color:var(--blu)}
.s3 b{font-family:var(--serif);font-weight:400;font-size:28px}
.mood{font-family:var(--serif);font-weight:400;font-size:21px}
.wk-row i svg{width:16px;height:16px;color:var(--rose)}.wk-row .on i{background:var(--rose-soft)}.wk-row .today i{box-shadow:0 0 0 2px var(--ink)}
.story-ok{background:var(--ink);color:var(--surface)}
.st-chip svg,.fix-lab svg,.blu-t .spark svg{width:14px;height:14px}
.st-chip{color:var(--ink)}.st-chip svg{color:var(--blu)}
.fix-lab{display:flex;align-items:center;gap:4px}
.blu-t .spark{display:inline-grid;vertical-align:-1px;color:var(--rose)}
.lg-play{background:var(--cta-bg)}
.fix-lab svg{color:var(--rose)}

/* v18 · 5-tab nav with the floating AI button back in the middle */
.nav button[data-go="ai"] .ic{width:54px;height:54px;border-radius:50%;margin-top:-24px;background:var(--cta-bg)!important;color:var(--cta-ink)!important;box-shadow:0 0 0 4px var(--bg),0 10px 22px -8px rgba(29,32,51,.6)!important}
.nav button[data-go="ai"] .ic svg{width:24px;height:24px}
.nav button[data-go="ai"][aria-current="page"]{color:var(--ink)!important}
.nav button[data-go="ai"][aria-current="page"] .ic{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--blu-soft),0 10px 22px -8px rgba(29,32,51,.6)!important}
/* patterns tab */
.wotd{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:24px;background:var(--cta-bg);color:var(--cta-ink)}
.wotd-l{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.wotd-main{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wotd-main>div:first-child{display:flex;flex-direction:column;gap:2px}
.wotd-en{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.05}
.wotd-th{font-size:14px;opacity:.8}
.wotd-act{display:flex;gap:6px}.wotd-act .icon-btn{background:rgba(255,255,255,.12);color:var(--cta-ink);border:0}
.wotd-ex{margin:2px 0 0;font-size:14px;opacity:.85;font-style:italic}
.wotd .link{color:var(--cta-ink);align-self:flex-start;opacity:.85}
.vcats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vcat{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .15s var(--spring)}
.vcat:active{transform:scale(.97)}
.vcat-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--blu-soft);color:var(--blu);flex:none}
.vcat-ic svg{width:19px;height:19px}.vcat-ic.xl{width:56px;height:56px;border-radius:18px}.vcat-ic.xl svg{width:28px;height:28px}
.vcat:nth-child(3n+2) .vcat-ic{background:var(--rose-soft);color:var(--rose)}.vcat:nth-child(3n) .vcat-ic{background:var(--sun-soft);color:var(--ink)}
.vcat-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.vcat-t b{font-size:14px;color:var(--ink);line-height:1.2}.vcat-t small{font-size:11.5px;color:var(--ink-3)}
.vcat-bar{flex-basis:100%;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}.vcat-bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.pcats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}.pcats::-webkit-scrollbar{display:none}
.pcat{flex:none;width:132px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left}
.pcat-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--surface-2);color:var(--ink);margin-bottom:6px}.pcat-ic svg{width:18px;height:18px}
.pcat b{font-size:14px;color:var(--ink)}.pcat small{font-size:11.5px;color:var(--ink-3)}
.vc-hero{display:flex;align-items:center;gap:14px}.vc-hero .t-page{margin:0;font-size:28px}.vc-hero .sub{margin:2px 0 0}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcard{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 0;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.wcard-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:10px 4px 10px 12px;text-align:left}
.wcard-main b{font-size:15px;color:var(--ink);line-height:1.25}.wcard-main span{font-size:12.5px;color:var(--ink-3)}
/* feels + translate */
.feel{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.02em;vertical-align:1px;background:var(--surface-2);color:var(--ink-2)}
.feel.f-b{background:var(--blu-soft);color:var(--blu)}.feel.f-r{background:var(--rose-soft);color:var(--rose)}.feel.f-g{background:#E4EFE6;color:#3D6B4A}.feel.f-s{background:var(--sun-soft);color:var(--ink)}.feel.f-k{background:var(--ink);color:var(--bg)}
.blu-foot .sug{display:inline-flex;align-items:center}
.tr-mode{width:auto!important;padding:0 8px;border-radius:12px!important;font-size:11px;font-weight:800;letter-spacing:.02em;background:var(--surface-2);color:var(--ink-3);gap:1px;align-self:center;height:30px!important}
.tr-mode span{opacity:.6}.tr-mode.on{background:var(--ink);color:var(--bg)}
.blu-comp{padding-left:6px}
.trbox{max-height:52vh;overflow:auto}
.tr-card{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 26px -18px rgba(22,26,44,.4);animation:popIn .22s var(--ease) both}
.tr-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-2)}
.tr-q{margin:0;font-size:12px;font-weight:800;color:var(--ink-3)}
.tr-opt{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:14px;padding-right:4px}
.tr-pick{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 10px;text-align:left}
.tr-en{font-size:15px;font-weight:700;color:var(--ink)}.tr-pick small{font-size:11.5px;color:var(--ink-3)}
.tr-pick:active{background:var(--blu-soft);border-radius:14px}
.tr-load{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-3)}.tr-load i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}.tr-load i:nth-child(2){animation-delay:.15s}.tr-load i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.tr-mode{white-space:nowrap;flex:none;min-width:52px}.blu-comp textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blu-comp .tr-mode{display:inline-flex!important;align-items:center;justify-content:center;gap:2px}
/* chat stays put while typing */
body.chatting{overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body.kb .nav{display:none}
body.kb .blu-page{bottom:auto}
.blu-page{touch-action:manipulation}
.blu-head,.blu-foot{flex:none}
.blu-comp textarea{font-size:16px!important}
.blu-foot{padding-bottom:calc(10px + 0px)}
body.kb .blu-foot{padding-bottom:8px}
/* typing: hide chips + nav, keep only the input above the keyboard */
body.kb .blu-foot .sugs-row{display:none!important}
body.kb .blu-foot{border-top:0;padding-top:6px}
body.kb .nav{display:none!important}
.acts .act:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.acts .act:last-child:nth-child(odd) .act-e{margin:0}
.acts .act:last-child:nth-child(odd) b{flex:none}
.lib-seg{margin-top:-4px}
.lib-count{margin:-4px 0 0}
.acts .act:last-child:nth-child(odd) span:last-child{flex:1}
.blu-page{transition:none!important;will-change:height}

/* ===== v19 daily habit home ===== */
.home2{gap:16px}
.f-pill.lit{background:var(--rose-soft);color:var(--rose)}
.hero2{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;padding:20px 18px 16px;border-radius:28px;background:var(--cta-bg);color:#F4F1EC}
.hero2::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(120,150,200,.35),transparent 70%);pointer-events:none}
.hero2.won::after{background:radial-gradient(circle,rgba(200,160,120,.4),transparent 70%)}
.hero2-top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hero2-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero2-hi{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#A9BCD8}
.hero2-h{margin:0;font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.08;letter-spacing:-.01em}
.hero2-sub{margin:4px 0 0;font-size:13.5px;line-height:1.45;color:rgba(244,241,236,.72)}
.ring2{position:relative;flex:none;width:92px;height:92px;color:#9DB6DA}
.hero2.won .ring2{color:#D2AE8A}
.ring2 svg{display:block}.ring2 .ring-fg{transition:stroke-dasharray .8s cubic-bezier(.2,.8,.2,1)}
.ring2-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F4F1EC;line-height:1}
.ring2-in b{font-size:30px;font-weight:800}.ring2-in small{font-size:11px;opacity:.65;margin-top:3px}
.ring2-in svg{width:34px;height:34px}
.h-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:relative;z-index:1}
.h-week>div{display:flex;flex-direction:column;align-items:center;gap:5px}
.h-week i{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.18)}
.h-week .on i{background:#D2AE8A;border:0;color:#2A1F16}
.h-week i svg{width:16px;height:16px}
.h-week .today i{box-shadow:0 0 0 2px var(--cta-bg),0 0 0 4px #9DB6DA}
.h-week small{font-size:11px;font-weight:700;opacity:.6}.h-week .today small{opacity:1}
.hero2-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:rgba(244,241,236,.7);border-top:1px solid rgba(255,255,255,.1);padding-top:11px;position:relative;z-index:1}
.hero2-foot span:first-child{display:inline-flex;align-items:center;gap:5px;color:#D2AE8A}
.hero2-foot svg{width:15px;height:15px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between}.sec-row .f-mini{margin:0}
.tasks{display:flex;flex-direction:column;gap:9px}
.task{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .12s}
.task:active{transform:scale(.98)}
.task-ic{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--blu-soft);color:var(--blu)}
.task-ic svg{width:22px;height:22px}
.task:nth-child(2) .task-ic{background:var(--rose-soft);color:var(--rose)}
.task:nth-child(3) .task-ic{background:var(--sun-soft);color:var(--sun)}
.task-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task-t b{font-size:15px;color:var(--ink)}.task-t small{font-size:12.5px;color:var(--muted)}
.task-bar{display:block;height:5px;border-radius:5px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.task-bar i{display:block;height:100%;border-radius:5px;background:var(--blu);transition:width .6s}
.task-n{flex:none;font-size:13px;font-weight:800;color:var(--muted)}
.task.done{background:var(--blu-soft);border-color:transparent}
.task.done .task-ic{background:var(--blu)!important;color:#fff!important}
.task.done .task-t b{color:var(--blu)}.task.done .task-n{color:var(--blu)}
.tmrw{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:var(--rose-soft);color:var(--rose)}
.tmrw svg{width:22px;height:22px;flex:none}.tmrw span{display:flex;flex-direction:column}.tmrw b{color:var(--ink);font-size:14.5px}.tmrw small{font-size:12.5px}
.lvlc{display:flex;align-items:center;gap:13px;width:100%;padding:13px 15px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:left}
.lvl-badge{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(from 200deg,var(--rose),var(--blu),var(--rose));padding:3px}
.lvl-badge b{width:100%;height:100%;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--ink)}
.lvl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.lvl-t b{font-size:14.5px;color:var(--ink)}.lvl-t small{font-size:12px;color:var(--muted)}
.lvl-bar{display:block;height:7px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.lvl-bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--rose),var(--blu))}
.miles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.mile{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.mile i{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2)}
.mile i svg{width:17px;height:17px}.mile b{font-size:14px;color:var(--ink)}.mile small{font-size:10.5px}
.mile.on i{background:var(--rose);color:#fff}
/* daily words deck */
.dw-cat{display:block;text-align:center;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 12px}
.dw-card{width:100%;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px 20px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(27,28,36,.35);text-align:center}
.dw-card.flip{background:var(--blu-soft);border-color:transparent}
.dw-en{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.1;color:var(--ink)}
.dw-th{font-size:19px;font-weight:700;color:var(--blu)}
.dw-ex{font-size:15px;line-height:1.5;color:var(--ink-2,var(--ink));opacity:.8;font-style:italic}
.dw-tap{font-size:13px;color:var(--muted)}
.dw-acts{display:flex;justify-content:center;gap:10px;margin-top:14px}
.dw-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dw-sum{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.dw-li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.dw-li b{font-size:15px;color:var(--ink)}.dw-li span{flex:1;font-size:13px;color:var(--muted)}

/* ===== v20 patterns hub ===== */
.spin{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px;border-radius:28px;background:var(--cta-bg);color:#F4F1EC}
.spin::before{content:"";position:absolute;left:-50px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(200,160,120,.28),transparent 70%);pointer-events:none}
.spin>*{position:relative}
.spin-top{display:flex;justify-content:space-between;align-items:center}
.spin-l{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#A9BCD8}
.spin-l svg{width:14px;height:14px}
.spin-n{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:rgba(244,241,236,.75)}
.spin-frame{font-family:var(--serif);font-size:30px;line-height:1.25;letter-spacing:-.005em;display:block}
.spin-slot{display:inline-block;margin:0 .12em;padding:0 .3em;border-radius:12px;background:#D2AE8A;color:#22180F;transition:transform .12s}
.spin-slot.pop{animation:slotpop .14s ease-out}
@keyframes slotpop{0%{transform:translateY(-30%);opacity:.3}100%{transform:none;opacity:1}}
.spin.spinning .spin-slot{background:#9DB6DA}
.spin-th{margin:0;font-size:15px;color:rgba(244,241,236,.78);min-height:22px}
.spin-acts{display:flex;align-items:center;gap:8px}
.spin-btn{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 18px;border-radius:99px;background:#F4F1EC;color:var(--cta-bg);font-weight:800;font-size:15px}
.spin-btn svg{width:18px;height:18px}
.spin.spinning .spin-btn svg{animation:spinr .5s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.spin .icon-btn.say{background:rgba(255,255,255,.1);color:#F4F1EC}
.spin-go{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;color:#D2AE8A}
.spin-go svg{width:16px;height:16px}
.spin-hint{margin:0;font-size:12px;color:rgba(244,241,236,.5)}
.ppath{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.ppath-track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ppath-track::before{content:"";position:absolute;left:12.5%;right:12.5%;top:22px;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}
.pp-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pp-node{position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--muted)}
.pp-node svg{position:absolute;inset:0;width:44px;height:44px;color:var(--blu)}
.pp-node>b{font-size:16px;font-weight:800}
.pp-step.cur .pp-node{background:var(--blu-soft);color:var(--blu);box-shadow:0 0 0 4px var(--surface),0 0 0 6px var(--blu-soft)}
.pp-step.done .pp-node{background:var(--blu);color:#fff}.pp-step.done .pp-node>svg{position:static;width:20px;height:20px;color:#fff}
.pp-step>b{font-size:12.5px;color:var(--ink);margin-top:4px}.pp-step small{font-size:11px;color:var(--muted)}
.pp-step.cur>b{color:var(--blu)}
.pp-next{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:13px 14px;border-radius:18px;background:var(--rose-soft);text-align:left}
.pp-next-l{grid-column:1;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rose)}
.pp-next-f{grid-column:1;font-size:17px;font-weight:700;color:var(--ink)}
.pp-next-f .slot{color:var(--rose)}

/* ================= daily plan + spaced repetition ================= */
function ensurePlan(){
  const t=dstr();
  if(S.plan&&S.plan.date===t&&S.plan.items.every(x=>byId[x.id]))return S.plan;
  const learned=Object.keys(S.pat).filter(id=>byId[id]);
  const due=learned.filter(id=>S.pat[id].due<=t)
    .sort((a,b)=>{const A=S.pat[a],B=S.pat[b];return (A.lastOk===false?0:1)-(B.lastOk===false?0:1)||A.due.localeCompare(B.due)});
  const fresh=CURRICULUM.filter(p=>!S.pat[p.id]).map(p=>p.id);
  let nNew=Math.min(fresh.length,Math.max(2,DAILY-due.length));
  let nRev=Math.min(due.length,DAILY-nNew);
  if(nNew+nRev<DAILY)nNew=Math.min(fresh.length,DAILY-nRev);
  const items=[...due.slice(0,nRev).map(id=>({id,review:true})),...fresh.slice(0,nNew).map(id=>({id,review:false}))];
  if(items.length<DAILY){learned.filter(id=>!items.some(x=>x.id===id)).sort((a,b)=>(S.pat[a].seen||'').localeCompare(S.pat[b].seen||'')).slice(0,DAILY-items.length).forEach(id=>items.push({id,review:true}))}
  S.plan={date:t,items,done:[]};save();return S.plan;
}
function record(id,ok){
  const t=dstr();let r=S.pat[id];
  if(!r){r=S.pat[id]={box:1,due:addDays(t,INTERVALS[0]),learned:t,wrong:ok?0:1,reps:1,seen:t,lastOk:ok}}
  else{
    const wasDue=r.due<=t;
    if(ok){if(wasDue||r.lastOk===false){r.box=Math.min(r.box+1,INTERVALS.length);r.due=addDays(t,INTERVALS[r.box-1])}}
    else{r.box=1;r.due=addDays(t,1);r.wrong=(r.wrong||0)+1}
    r.reps=(r.reps||0)+1;r.seen=t;r.lastOk=ok;
  }
  const plan=ensurePlan();
  if(plan.items.some(x=>x.id===id)&&!plan.done.includes(id))plan.done.push(id);
  markDay();S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,8);save();
}
function streak(){const set=new Set(S.days);let d=dstr();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1)}if(n>(S.bestStreak||0))S.bestStreak=n;return n}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let srBlocked=!SR;
const EXP={"i'm":"i am","gonna":"going to","wanna":"want to","gotta":"got to","kinda":"kind of","don't":"do not","i'll":"i will","i'd":"i would","where's":"where is","what's":"what is","it's":"it is","we'll":"we will","let's":"let us","didn't":"did not","can't":"can not","cannot":"can not","whatcha":"what are you","ok":"okay","5":"five","how's":"how is","that's":"that is","you're":"you are","we're":"we are","they're":"they are","isn't":"is not","doesn't":"does not"};
function norm(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/7-eleven/g,'seven eleven').replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).filter(Boolean).flatMap(w=>(EXP[w]||w).split(' ')).map(w=>w.replace(/'/g,''))}
function lcs(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>new Array(n+1).fill(0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[m][n]}
function scoreSpeech(target,heard,conf){const t=norm(target),h=norm(heard);if(!t.length)return null;const l=lcs(t,h),acc=l/t.length,extra=Math.max(0,h.length-l);const pron=conf>0?conf:acc;return {level:acc>=.85?'good':acc>=.5?'almost':'retry',acc,checks:{pron:pron>=.7&&acc>=.6,acc:acc>=.85,nat:acc>=.85&&extra<=1}}}
function startRec(cb){
  let r;try{r=new SR()}catch(e){cb({err:'unsupported'});return null}
  r.lang='en-US';r.interimResults=false;r.maxAlternatives=4;r.continuous=true;let alts=[],conf=0,err=null;
  r.onresult=e=>{const res=Array.from(e.results);const base=res.slice(0,-1).map(x=>x[0].transcript).join(' ');const last=res[res.length-1];alts=Array.from(last).map(a=>(base+' '+a.transcript).trim());const cs=res.map(x=>x[0].confidence||0);conf=cs.reduce((a,b)=>a+b,0)/cs.length};
  r.onerror=e=>{err=e.error};r.onend=()=>cb({alts,conf,err});
  try{r.start()}catch(e){cb({err:'not-allowed'});return null}return r;
}

function micHTML(size=''){

const micNote=()=>`<p class="mic-note">Automatic checking needs microphone access, which this view doesn’t allow. Listen, say it out loud, then rate yourself.</p>`;
function mountMic(root,getTarget,onResult){
  if(!root)return;
  const btn=$('.mic',root),hint=$('.mic-hint',root),fb=$('.feedback',root);
  let rec=null,t0=0,active=false,toggled=false,timer=null,usingSR=false;
  const idle=()=>srBlocked?'Hold, say it out loud, release':'Hold to speak';
  function begin(){if(active)return;active=true;toggled=false;t0=Date.now();stopAudio();btn.classList.add('rec');fb.hidden=true;usingSR=!srBlocked;
    if(usingSR){hint.textContent='Listening… release when done';rec=startRec(finish)}else hint.textContent='Say it out loud now…';timer=setTimeout(end,9000)}
  function end(){if(!active)return;active=false;clearTimeout(timer);btn.classList.remove('rec');if(usingSR){hint.textContent='Checking…';if(rec){try{rec.stop()}catch(e){}}}else selfCheck()}
  function finish(res){
    rec=null;
    if(res.err&&/not-allowed|service-not-allowed|audio-capture|unsupported/.test(res.err)){srBlocked=true;if(!$('.mic-note',root))root.insertAdjacentHTML('beforeend',micNote());selfCheck();return}
    const target=getTarget();const alts=(res.alts||[]).filter(Boolean);
    if(!alts.length){hint.textContent='Didn’t catch that. Hold the button while you speak.';return}
    let best=null,heard='';alts.forEach(a=>{const s=scoreSpeech(target,a,res.conf);if(s&&(!best||s.acc>best.acc)){best=s;heard=a}});
    S.speaks++;markDay();save();hint.textContent=idle();
    const M={good:['Sounds natural!','Great rhythm. Say it once more to lock it in.'],almost:['Almost there','Listen once more, then try again.'],retry:['Let’s try again','Tap Listen to hear it, then hold and repeat.']}[best.level];const c=best.checks;
    fb.className='feedback '+best.level;fb.hidden=false;
    fb.innerHTML=`<div class="fb-title">${best.level==='good'?`<span class="ic-tile good">${CHECK_DRAW}</span>`:''}${M[0]}</div><p>${M[1]}</p><div class="fb-checks"><span class="${c.pron?'ok':''}">${c.pron?'✓':'•'} Pronunciation</span><span class="${c.acc?'ok':''}">${c.acc?'✓':'•'} Accuracy</span><span class="${c.nat?'ok':''}">${c.nat?'✓':'•'} Naturalness</span></div><p class="fb-heard">We heard: <q>${esc(heard)}</q></p>`;
    if(best.level==='good')setTimeout(()=>celebrate(fb.querySelector('.ic-tile'),14),60);
    onResult&&onResult({ok:best.level==='good',level:best.level});
  }
  function selfCheck(){
    hint.textContent=idle();fb.className='feedback self';fb.hidden=false;
    fb.innerHTML=`<div class="fb-title">How did it sound?</div><p class="meta">Tap Listen first if you’re not sure.</p><div class="self-btns"><button class="btn btn-sm btn-accent" data-r="1">Nailed it ✓</button><button class="btn btn-sm btn-ghost" data-r="0">Not yet</button></div>`;
    $$('[data-r]',fb).forEach(b=>b.addEventListener('click',()=>{const ok=b.dataset.r==='1';S.speaks++;markDay();save();fb.className='feedback '+(ok?'good':'retry');
      fb.innerHTML=ok?`<div class="fb-title"><span class="ic-tile good">${CHECK_DRAW}</span>Nice!</div><p>Keep that rhythm. Say it a couple more times to lock it in.</p>`:`<div class="fb-title">No problem</div><p>Listen, then say it slowly. Speed comes later.</p>`;if(ok)setTimeout(()=>celebrate(fb.querySelector('.ic-tile'),12),60);onResult&&onResult({ok,level:ok?'good':'retry'})}));
  }
  btn.addEventListener('pointerdown',e=>{e.preventDefault();if(active&&toggled){end();return}begin();try{btn.setPointerCapture(e.pointerId)}catch(_){}});
  btn.addEventListener('pointerup',()=>{if(!active||toggled)return;if(Date.now()-t0<350){toggled=true;hint.textContent='Tap again when you’re done';return}end()});
  btn.addEventListener('pointercancel',()=>{if(!toggled)end()});
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();if(active)end();else{begin();toggled=true;hint.textContent='Press again when you’re done'}}});
}

const SEG=(window.Intl&&Intl.Segmenter)?new Intl.Segmenter('th',{granularity:'word'}):null;
const STOP=new Set(['ซื้อ','อยาก','จะ','พูด','ว่า','ยังไง','อย่างไร','ภาษาอังกฤษ','การ','ที่','ไหม','บอก','ถาม','คำ','ประโยค','ใน','เวลา','ตอน','เมื่อ','กับ','ให้','ได้','แบบ','the','a','an','to','how','i','in','say','do','you','is']);

const VC={};D.vocab.forEach(c=>{VC[c.id]=c;c.ids=c.words.map(w=>addEntry({en:w[0],th:w[1],ex:w[2],tone:'n',icon:c.icon,where:c.name,whereTh:c.th,vcat:c.id,src:'word'}).id)});
const WORD_IDS=D.vocab.flatMap(c=>c.ids);
const SEARCHABLE=[...firstByEn.values()];
function qTokens(q){const out=[];q.toLowerCase().split(/\s+/).filter(Boolean).forEach(w=>{if(/[฀-๿]/.test(w)&&SEG){for(const s of SEG.segment(w))if(s.isWordLike)out.push(s.segment)}else out.push(w.replace(/[^a-z0-9'฀-๿-]/g,''))});return out.filter(Boolean)}
function search(q){
  q=q.trim();if(!q)return [];
  const toks=qTokens(q),core=toks.filter(t=>!STOP.has(t)),use=core.length?core:toks;const ql=q.toLowerCase();
  const res=[];
  SEARCHABLE.forEach(e=>{
    const en=e.en.toLowerCase();const hay=en+' '+(e.alt||'').toLowerCase()+' '+e.th+' '+(e.when||'')+' '+e.where.toLowerCase()+' '+(e.whereTh||'');
    let score=0,all=true;
    use.forEach(t=>{const dict=D.dict[t];if(hay.includes(t)){score+=en.includes(t)?3:2}else if(dict&&dict.split(' ').some(w=>en.includes(w))){score+=2}else all=false});
    if(!all&&hay.includes(ql)){all=true;score+=3}
    if(all&&score){if(e.en.toLowerCase().startsWith(ql))score+=2;if(e.th.includes(q))score+=4;if(e.th.startsWith(q))score+=2;score-=Math.min(2,e.en.length/60);score+={phrase:1.5,travel:1.2,native:1.2,var:1,pattern:.5,email:.9,word:1.4}[e.src];res.push([score,e])}
  });
  return res.sort((a,b)=>b[0]-a[0]).slice(0,40).map(x=>x[1]);
}

const IKEYS={'ตามงาน':'Follow-up','ตาม':'Follow-up','ลา':'Leave','ลางาน':'Leave','เลื่อน':'Delay','ช้า':'Delay','ล่าช้า':'Delay','ราคา':'Quotation','ใบเสนอราคา':'Quotation','po':'Order & PO','อนุมัติ':'Approval','ประชุม':'Meeting','นัด':'Meeting','ขอโทษ':'Apolog','แนบ':'Sending Documents','อีเมล':'Write a work email','email':'Write a work email','เที่ยว':'Travel','กิน':'Food','ร้านอาหาร':'Food','ช้อป':'Shopping','ซื้อ':'Shopping','โรงแรม':'Hotel','ป่วย':'Emergency','ไม่สบาย':'Emergency','เพื่อน':'Friends','เดท':'dating','ทักทาย':'Daily conversation','คำถาม':'Questions','ปฏิเสธ':'Negatives'};

function findIntents(q,results=[]){
  const toks=qTokens(q).filter(t=>!STOP.has(t)&&!ISTOP.has(t));const ql=q.trim().toLowerCase();if(!ql)return [];
  const res=[];const push=(sc,it)=>res.push([sc,it]);
  results.slice(0,3).forEach((e,k)=>{let it=null;
    if(e.sid){const sb=SUBS[e.sid];it=INTENTS.find(x=>x.act===`data-push="sit:${e.sid}"`)}
    else if(e.ecat)it=INTENTS.find(x=>x.act===`data-push="ecat:${e.ecat}"`);
    if(it)push(9-k,it)});
  INTENTS.forEach(it=>{const hay=(it.name+' '+it.th).toLowerCase();let sc=0;
    if(hay.includes(ql))sc+=5;toks.forEach(t=>{if(t.length>1&&hay.includes(t))sc+=2;const k=IKEYS[t];if(k&&it.name.toLowerCase().includes(k.toLowerCase()))sc+=3});
    const k=IKEYS[ql];if(k&&it.name.toLowerCase().includes(k.toLowerCase()))sc+=3;
    if(sc>=3)push(sc+(it.tag?0:.5),it)});
  const seen=new Set();return res.sort((a,b)=>b[0]-a[0]).map(x=>x[1]).filter(it=>!seen.has(it.act)&&seen.add(it.act)).slice(0,3);
}

    $('#play-all',ovEl).addEventListener('click',()=>{const list=p.examples.slice(0,5).map(x=>x[0]);let i=0;const btns=$$('.row .say',ovEl);const step=()=>{if(i>=list.length||!L||L.step!==0)return;say(list[i],{btn:btns[i],onend:()=>{i++;setTimeout(step,350)}})};step()});

    if(o===q.ex[5]){q.done=true;if(!q.tried.length)L.first++;L.made.add(q.ex[0]);renderLesson();autoSay(q.ex[0]);celebrate($('.opt.right',ovEl),14)}
    else{q.tried.push(o);L.shake=o;if(q.tried.length===1){L.wrongs.push({en:q.ex[0],th:q.ex[1]});S.wrong[q.ex[0]]=(S.wrong[q.ex[0]]||0)+1;save()}renderLesson()}}))}
  if(s===3){mountMic($('.mic-wrap',ovEl),()=>L.targets[L.tIdx].en,r=>{L.attempts.push(r.ok);L.made.add(L.targets[L.tIdx].en);$('.o-foot',ovEl).innerHTML=lFoot();bindFoot()});$('#next-t',ovEl)?.addEventListener('click',()=>{L.tIdx++;renderLesson()})}
  if(s===4){$$('[data-c]',ovEl).forEach(b=>b.addEventListener('click',()=>{const c=L.convos[L.cIdx];L.cPick=c.chips[+b.dataset.c];const mine=sentence(p,L.cPick[0]);L.made.add(mine);renderLesson();autoSay(mine)}));mountMic($('.mic-wrap',ovEl),()=>sentence(p,L.cPick[0]),r=>L.attempts.push(r.ok))}
  if(s===5){setTimeout(()=>celebrate($('#sum-badge',ovEl),L.levelUp||L.allDone?30:20),260)}
}

function finishLesson(){
  const a=L.attempts;const good=a.filter(Boolean).length;
  L.ok=(L.pq.length>0&&L.first===L.pq.length)||(a.length>0&&good/a.length>=.5);
  const lvl=L.p.level;const lvlDone=()=>P.filter(x=>x.level===lvl).every(x=>S.pat[x.id]);const before=lvlDone();const allBefore=!nextItem();

}

  const p=EPAT[id];if(!p)return;const ws=p.words;const qw=pick(ws.slice(1));const others=shuffle(ws.filter(x=>x!==qw)).slice(0,3);const w2=pick(ws);
  const avoid=p.avoid.includes('{}')?p.avoid.replace('{}',w2[0]):p.avoid;const ask=Math.random()<.5?'Friendly':'Formal';
  const qs=[{type:'fill',w:qw,opts:shuffle([qw,...others]).map(x=>({t:x[0],th:x[1],ok:x===qw}))},
    {type:'nat',opts:shuffle([{t:esent(p,'Natural',w2[0]),ok:true},{t:avoid,ok:false}])},
    {type:'tone',ask,opts:shuffle([{t:esent(p,'Friendly',w2[0]),ok:ask==='Friendly'},{t:esent(p,'Formal',w2[0]),ok:ask==='Formal'}])}];
  qs.forEach(q=>{q.tried=[];q.done=false});
  openOverlay();
  E={p,c:ECAT[p.cat],step:0,tone:S.eTone||'Polite',w:ws[0],made:new Set(),tonesUsed:new Set(),parts:{open:0,main:1,att:/attach/i.test(Object.values(p.tones).join(' '))?2:0,close:0,greet:0,sign:0},f:{to:'Khun Somchai',project:'Project A',date:'May 15',me:S.eName||''},qs,qi:0,first:0,review:!!S.email[id]};
  E.made.add(esent(p,E.tone,E.w[0]));E.tonesUsed.add(E.tone);
  renderEmail();
}
function eMainOpts(){const p=E.p,w=E.w[0];return ['Natural','Polite','Professional'].map(t=>[esent(p,t,w),t])}
function eMail(){const o=E.parts;const op=EM.common.opening[o.open],mn=eMainOpts()[o.main],at=ATTACH[o.att],cl=EM.common.closing[o.close];
  return {to:E.f.to,me:E.f.me,subject:fillTok(SUBJ[E.p.cat],E.f),greet:o.greet,sign:o.sign,paras:[[{t:op[0],k:'open'}],[{t:mn[0],k:'main'},{t:at[0],k:'att'}],[{t:cl[0],k:'close'}]]}}
function renderEmail(){
  const s=E.step,n=ESTEPS.length;
  ovEl.innerHTML=`<div class="o-head"><button class="icon-btn" data-close aria-label="Close">${I.close}</button>
    <div class="stepper" role="progressbar" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${s+1}">${ESTEPS.map((x,i)=>`<i class="${i<s?'done':i===s?'cur':''}"></i>`).join('')}</div>${sndBtn()}</div>
    <div class="step-label"><b><em>${String(s+1).padStart(2,'0')}</em>${ESTEPS[s][0]}</b><span>${s<n-1?'Next: '+ESTEPS[s+1][0]:'Done'}</span></div>
    <div class="o-body"><div class="o-inner">${[eLearn,eBuild,eCompose,ePractice,eUse,eReview][s]()}</div></div><div class="o-foot">${eFoot()}</div>`;
  $('.o-body',ovEl).scrollTop=0;bindEmail();
}
const eCrumbs=()=>`<div class="crumbs"><span>Work Email</span><span class="dot"></span><span>${esc(E.c.name)}</span>${E.review?'<span class="tag accent">Review</span>':''}</div>`;
function eLearn(){

  <div class="pcard" style="--c:${E.c.hue}"><span class="eyebrow">Email pattern</span><div class="pattern-big">${frameHTML(p)}</div><p class="meaning">${esc(p.meaning)}</p></div>
  <div class="e-tip">${inl('sparkle')}<span>${esc(p.tip)}</span></div>
  <section class="stack-sm"><h2 class="t-card">Same idea, 5 tones</h2><div class="list">${EM.tones.map(t=>{const x=esent(p,t,w);return `<div class="level-row"><span class="row-text"><span class="lv-label ${t==='Polite'?'hi':''}">${t} · ${esc(TONE_TH[t])}</span><span class="row-en">${esc(x)}</span></span>${sayBtn(x)}</div>`}).join('')}</div></section>
  <section class="stack-sm"><h2 class="t-card">Don’t write it like this</h2><div class="ba"><div class="ba-bad"><span class="ba-tag">Avoid</span><s>${esc(av)}</s></div><div class="ba-good"><span class="ba-tag">Better</span><span class="row-en">${esc(esent(p,'Natural',w))}</span></div></div></section>`;
}
function eBuild(){

    <div class="audio-row"><button class="pill-btn" data-say="${esc(full)}">${I.spk} Listen</button><button class="pill-btn plain" id="e-copy1">${svgI('clipboard',2)} Copy</button></div></div>
  <div class="chips" role="group" aria-label="Words">${p.words.map((x,i)=>`<button class="chip ${x===w?'sel':''}" data-ew="${i}"><b>${esc(x[0])}</b><small>${esc(x[1])}</small></button>`).join('')}</div>
  <div class="goal"><span class="gdots">${[0,1,2].map(i=>`<i class="${i<Math.min(E.made.size,3)?'on':''}"></i>`).join('')}</span><span>${E.made.size>=3?`${E.made.size} sentences built · ${E.tonesUsed.size} tone${E.tonesUsed.size>1?'s':''} tried`:`Build ${3-E.made.size} more sentence${3-E.made.size>1?'s':''}`}</span></div>`;
}
function eCompose(){
  const o=E.parts;
  return `${stepIntro('Build a short email','เลือกทีละส่วน อีเมลด้านล่างจะเปลี่ยนตามทันที')}

}
function ePractice(){
  const p=E.p,q=E.qs[E.qi];let head='',sub='';
  if(q.type==='fill'){head=`<div class="q-big">${q.done?frameHTML(p,q.w[0]):frameHTML(p,null,true)}</div>`;sub=`<p class="th">${esc(ethai(p,q.w[1]))}</p>`}
  if(q.type==='nat'){head=`<div class="q-big" style="font-size:18px">Which one sounds natural in a work email?</div>`;sub=`<p class="th">ประโยคไหนฟังเป็นธรรมชาติกว่า</p>`}
  if(q.type==='tone'){head=`<div class="q-big" style="font-size:18px">${q.ask==='Friendly'?'Writing to a colleague you know well':'Writing to a senior manager or a new customer'}</div>`;sub=`<p class="th">${q.ask==='Friendly'?'เขียนถึงเพื่อนร่วมงานที่สนิทกัน':'เขียนถึงผู้บริหาร หรือลูกค้าใหม่ที่ยังไม่สนิท'} แบบไหนเหมาะกว่า?</p>`}
  const right=q.opts.find(x=>x.ok);
  return `${stepIntro('Practice','เลือกคำตอบที่ใช้ได้จริงในงาน')}
  <div class="q-card"><span class="eyebrow">Question ${E.qi+1} of ${E.qs.length}</span>${head}${sub}</div>
  <div class="opts">${q.opts.map((o,k)=>{const r=q.done&&o.ok,wr=q.tried.includes(k);return `<button class="opt ${r?'right':''} ${wr?'wrong':''}" data-eq="${k}" ${q.done||wr?'disabled':''}><span class="key">${'ABCD'[k]}</span><span>${esc(o.t)}${q.type==='fill'?`<small class="meta"> · ${esc(o.th)}</small>`:''}</span></button>`}).join('')}</div>
  ${q.done?`<div class="explain ok"><div class="fb-title"><span class="ic-tile good">${CHECK_DRAW}</span>${q.tried.length?'Got it!':'Nice!'}</div><p class="th">${q.type==='fill'?esc(esent(p,'Polite',q.w[0])):q.type==='nat'?esc(p.tip):q.ask==='Friendly'?'สนิทกันใช้ Friendly ได้ สั้นและอบอุ่น':'ผู้ใหญ่/ลูกค้าใหม่ ใช้ Formal หรือ Polite ปลอดภัยกว่า'}</p>${q.type!=='fill'?sayBtn(right.t,''):''}</div>`
  :q.tried.length?`<div class="explain no"><div class="fb-title">Almost! Try again.</div></div>`:''}`;

function eUse(){
  return `${stepIntro('Use it in real work','ใส่ชื่อจริง แล้วกด Copy ไปวางในอีเมลได้เลย')}
  ${fieldsHTML(E.f,['to','project','me'])}
  <div class="tone-row">${SIGN.map((x,i)=>`<button class="tone-chip ${i===E.parts.sign?'on':''}" data-ep="sign:${i}">${x},</button>`).join('')}</div>
  <div id="mail-wrap">${mailHTML(eMail())}</div>
  <div class="audio-row"><button class="btn btn-soft btn-sm" id="e-copy">${svgI('clipboard',2)} Copy email</button><button class="pill-btn plain" id="e-copys">Copy subject</button></div>`;
}
function eReview(){
  const p=E.p;const r=S.email[p.id];
  return `<div class="summary"><span class="ic-tile xxl good badge-pop" id="sum-badge">${CHECK_DRAW}</span><h2 class="t-page">${E.review?'Reviewed!':'Email pattern learned!'}</h2>
    <div class="pattern-big" style="font-size:20px">${frameHTML(p)}</div><p class="th">ครั้งหน้าเจอสถานการณ์นี้ รู้เลยว่าต้องเขียนอะไร</p></div>
  <div class="sum-stats"><div><b>${E.made.size}</b><span>Sentences built</span></div><div><b>${E.tonesUsed.size}</b><span>Tones tried</span></div><div><b>${E.first}/${E.qs.length}</b><span>First try</span></div></div>

function eFoot(){
  const s=E.step;const cont=l=>`<button class="btn btn-accent btn-block" id="e-next">${l} ${I.arrow}</button>`;
  if(s===0)return cont('Continue to Build');

}
const p0=()=>E.p.id;
function bindEmail(){
  const s=E.step,p=E.p;
  $('#e-next',ovEl)?.addEventListener('click',()=>{stopAudio();
    if(s===3&&E.qi<E.qs.length-1){E.qi++;renderEmail();return}
    if(s===4){finishEmail();return}
    E.step++;renderEmail()});
  if(s===1){
    const upd=()=>{const full=esent(p,E.tone,E.w[0]);const isNew=!E.made.has(full);E.made.add(full);E.tonesUsed.add(E.tone);renderEmail();if(isNew&&E.made.size===3)celebrate($('.goal .gdots',ovEl),12);autoSay(full)};
    $$('[data-ew]',ovEl).forEach(b=>b.addEventListener('click',()=>{E.w=p.words[+b.dataset.ew];upd()}));
    $$('[data-tone]',ovEl).forEach(b=>b.addEventListener('click',()=>{E.tone=b.dataset.tone;S.eTone=E.tone;save();upd()}));
    $('#e-copy1',ovEl).addEventListener('click',e=>copyText(esent(p,E.tone,E.w[0]),e.currentTarget));
  }
  const refresh=()=>{const w=$('#mail-wrap',ovEl);if(w)w.innerHTML=mailHTML(eMail())};

  if(s===3){$$('[data-eq]',ovEl).forEach(b=>b.addEventListener('click',()=>{const q=E.qs[E.qi];const k=+b.dataset.eq;const o=q.opts[k];
    if(o.ok){q.done=true;if(!q.tried.length)E.first++;renderEmail();if(q.type==='fill')autoSay(esent(p,'Polite',q.w[0]));celebrate($('.opt.right',ovEl),14)}
    else{q.tried.push(k);renderEmail()}}))}
  if(s===5)setTimeout(()=>celebrate($('#sum-badge',ovEl),22),260);
}
function finishEmail(){
  const t=dstr();const r=S.email[E.p.id];const box=Math.min(INTERVALS.length,(r?r.box:0)+(E.first>=2||!r?1:0)||1);
  S.email[E.p.id]={box,due:addDays(t,INTERVALS[box-1]),t};markDay();save();E.step=5;renderEmail();
}

/* ================= overlay: situation mode ================= */
function openScene(id){S.lastAct={k:'scen',id};save();openOverlay();SC={s:SCEN[id],t:-1,picked:null,score:0,history:[],order:null};renderScene()}
function renderScene(){
  const {s,t}=SC;const total=s.turns.length;
  const head=`<div class="o-head"><button class="icon-btn" data-close aria-label="Close">${I.close}</button><div class="bar"><i style="width:${t<0?0:Math.min(t+(SC.picked!=null?1:0),total)/total*100}%"></i></div><span class="meta num">${Math.max(0,Math.min(t+1,total))}/${total}</span>${sndBtn()}</div>`;
  let body='',foot='';
  if(t<0){
    body=`<div class="scene-intro">${hueIcon(IC.scen[s.id],HUE[s.group],'xxl')}<span class="eyebrow">Situation Mode</span><h1 class="t-page">${esc(s.title)}</h1><p class="sub">${esc(s.where)}<br>${esc(s.whereTh)}</p><p class="meta">${total} turns. Choose the most natural reply, then say it out loud.</p></div>`;
    foot=`<button class="btn btn-accent btn-block" id="sc-next">Start</button>`;
  }else if(t>=total){
    const perfect=SC.score===total;
    body=`<div class="scene-intro"><span class="badge-pop" id="sc-badge">${perfect?`<span class="ic-tile xxl good">${svgI('star',2)}</span>`:hueIcon(IC.scen[s.id],HUE[s.group],'xxl')}</span><div class="result-big num">${SC.score}/${total}</div><h2 class="t-sec">${perfect?'Perfect! You handled it like a local.':'Nice work. Try again to get them all.'}</h2></div>
    <section class="stack-sm"><h3 class="t-card">Phrases from this scene</h3><div class="list">${s.turns.map(tn=>{const o=tn.opts.find(x=>x[1]);const e=firstByEn.get(o[0])||addEntry({en:o[0],th:o[2],tone:'n',icon:IC.scen[s.id],where:s.title,whereTh:s.whereTh,src:'scene'});return rowHTML(e,{meta:false})}).join('')}</div></section>`;
    foot=`<button class="btn btn-accent btn-block" id="sc-again">Play again</button><button class="btn btn-ghost btn-block" data-close>Done</button>`;
  }else{

function reviewPool(mode){
  let items=[];const add=e=>{if(e&&e.th&&!items.some(x=>x.en===e.en))items.push(e)};
  if(mode==='saved')Object.keys(S.saved).forEach(en=>add(firstByEn.get(en)));
  else if(mode==='native')NATIVE_IDS.forEach(i=>add(ENTRIES[i]));
  else if(mode==='travel')D.travel.forEach(t=>t.ids.forEach(i=>add(ENTRIES[i])));
  else if(mode==='email'||mode.startsWith('email:')){const cat=mode.slice(6);const ps=EM.patterns.filter(p=>(!cat||p.cat===cat));const got=ps.filter(p=>S.email[p.id]);(got.length?got:ps.slice(0,2)).forEach(p=>shuffle(p.exIds.slice()).slice(0,4).forEach(i=>add(ENTRIES[i])));if(items.length<6)ps.forEach(p=>p.exIds.slice(0,2).forEach(i=>add(ENTRIES[i])))}
  else if(mode.startsWith('epat:')){const p=EPAT[mode.slice(5)];p.exIds.forEach(i=>add(ENTRIES[i]));EM.patterns.filter(x=>S.email[x.id]&&x!==p).forEach(x=>x.exIds.slice(0,2).forEach(i=>add(ENTRIES[i])))}
  else if(mode.startsWith('vcat:')){const c=VC[mode.slice(5)];c.ids.forEach(i=>add(ENTRIES[i]))}
  else if(mode.startsWith('sit:'))SUBS[mode.slice(4)].ids.forEach(i=>add(ENTRIES[i]));
  else if(mode.startsWith('pat:')){const p=byId[mode.slice(4)];shuffle(p.exIds.slice()).slice(0,8).forEach(i=>add(ENTRIES[i]));
    Object.keys(S.pat).filter(id=>byId[id]&&id!==p.id).forEach(id=>shuffle(byId[id].exIds.slice()).slice(0,2).forEach(i=>add(ENTRIES[i])))}
  else{
    Object.keys(S.wrong).forEach(en=>add(firstByEn.get(en)));
    Object.keys(S.pat).filter(id=>byId[id]).forEach(id=>shuffle(byId[id].exIds.slice()).slice(0,5).forEach(i=>add(ENTRIES[i])));
    S.seen.slice(0,60).forEach(en=>add(firstByEn.get(en)));Object.keys(S.saved).forEach(en=>add(firstByEn.get(en)));
  }
  const real=items.length;
  if(items.length<6){CURRICULUM.slice(0,2).forEach(p=>p.exIds.slice(0,5).forEach(i=>add(ENTRIES[i])));NATIVE_IDS.slice(0,8).forEach(i=>add(ENTRIES[i]))}
  items.real=real;return items;
}
function distract(correct,field,pool,n=3){
  const seen=new Set([correct[field]]);const out=[];
  const bank=pool.length&&pool.every(e=>e.src==='email')?EM.patterns.flatMap(p=>p.exIds.map(i=>ENTRIES[i])):SEARCHABLE;const src=shuffle(pool.concat(shuffle(bank.slice()).slice(0,40)));
  for(const e of src){if(out.length>=n)break;const v=e[field];if(v&&!seen.has(v)&&v.length<70){seen.add(v);out.push(v)}}
  return out;
}
function buildReview(mode){
  const pool=reviewPool(mode);
  const order=shuffle(pool.slice()).sort((a,b)=>(S.wrong[b.en]||0)-(S.wrong[a.en]||0));
  let k=0;const nextItemR=()=>order[k++%order.length];
  const learnedPats=mode.startsWith('pat:')?[byId[mode.slice(4)]]:Object.keys(S.pat).map(id=>byId[id]).filter(Boolean);
  const types=['en2th','th2en','fill','speak','natural','convo','th2en','en2th'];
  if(!['all'].includes(mode)&&!mode.startsWith('pat:')){types[2]='th2en';types[5]='en2th'}
  if(!learnedPats.length&&types[2]==='fill')types[2]='th2en';
  if(/^e(mail|pat)/.test(mode)){types[4]='th2en';types[5]='en2th'}
  const qs=[];
  shuffle(types).forEach(tp=>{
    if(tp==='en2th'||tp==='th2en'){const e=nextItemR();const f=tp==='en2th'?'th':'en';const opts=shuffle([{t:e[f],ok:true},...distract(e,f,pool).map(t=>({t,ok:false}))]);qs.push({type:tp,e,opts})}
    else if(tp==='fill'){const p=pick(learnedPats);const ex=pick(p.examples);const fills=[...new Set(p.examples.map(x=>x[5]).concat(p.words.map(w=>w[0])))].filter(f=>f!==ex[5]);
      qs.push({type:'fill',p,ex,e:firstByEn.get(ex[0])||ENTRIES[p.exIds[0]],opts:shuffle([{t:ex[5],ok:true},...shuffle(fills).slice(0,3).map(t=>({t,ok:false}))])})}
    else if(tp==='speak'){qs.push({type:'speak',e:nextItemR()})}
    else if(tp==='natural'){const n=pick(D.natural);qs.push({type:'natural',n,e:firstByEn.get(n[0])||{en:n[0],th:n[2]},opts:shuffle([{t:n[0],ok:true},...n[1].map(t=>({t,ok:false}))])})}
    else if(tp==='convo'){const s=pick(D.scenarios);const tn=pick(s.turns);const c=tn.opts.find(o=>o[1]);qs.push({type:'convo',s,tn,e:firstByEn.get(c[0])||{en:c[0],th:c[2]},opts:shuffle(tn.opts.map(o=>({t:o[0],ok:o[1],note:o[3]})))})}
  });
  // keep speaking away from the very first question
  if(qs[0].type==='speak')qs.push(qs.shift());
  return qs;
}
function openReview(mode='all'){const qs=buildReview(mode);openOverlay();R={mode,qs,i:0,ok:0,missed:[],ans:null,revealed:false};renderReview()}

  const contents=messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}));
  const list=[...new Set([S.fbModel,CFG.model,...FB_MODELS].filter(Boolean))];let last=null;
  for(const name of list){

      try{const model=getGenerativeModel(ai,{model:name,systemInstruction:system,generationConfig:gc});

        const txt=r.response.text();if(!txt||!txt.trim())throw new Error('empty reply');

        if(/429|RESOURCE_EXHAUSTED|quota/i.test(m))throw {code:'rate_limited',m};
        if(/app.?check/i.test(m))throw {code:'appcheck',m};
        if(/SERVICE_DISABLED|has not been used|to be enabled|not enabled/i.test(m))throw {code:'api_off',m};
        if(/PERMISSION_DENIED|API key|api-key|unauthor|\b40[13]\b/i.test(m))throw {code:'bad_key',m};
        if(think&&/thinking/i.test(m))continue;
        if(/not found|404|not supported|unsupported|invalid.*model|empty reply/i.test(m)){if(S.fbModel===name){S.fbModel=null;save()}break}
        throw {code:'fb_error',m}}
    }
  }

}

function aiRules(chat){
  const m=aiMode(chat.mode),st=aiStyle(chat.style),lv=aiLevel(chat.level);
  const pats=(chat.focus||[]).map(id=>byId[id]).filter(Boolean);
  return `You are an English conversation partner inside "BluTalk", a speaking app for Thai learners of English.
SCENARIO: ${m.scene}
YOUR ROLE: ${m.role}. Stay in this role.
TONE: ${st.p}.
LEVEL: ${lv.p}
${pats.length?`PATTERNS THE LEARNER JUST STUDIED (weave them into your questions so the learner can answer with them, and use them yourself when natural; do not force every turn):\n${pats.map(p=>`- "${patLabel(p)}" = ${p.meaning} e.g. "${p.examples[0][0]}", "${p.examples[3][0]}"`).join('\n')}\n`:''}RULES:
- Sound like a real friend texting: warm, natural, casual, 1-2 short sentences. Do not use emojis. You are a conversation partner, not a teacher.
- Never praise grammar and never say things like "Great job!", "Excellent!" or "Your grammar is correct". Just respond to what they said.
- Remember facts the learner shares (job, plans, people, places) and refer back to them. Never ask for information they already gave.
- Remember everything said so far and stay on the current topic. Never jump to a random new topic. React to what the learner actually said, then ask ONE natural follow-up question.
- Use real spoken American English, never textbook English.
- Look only at the learner's LAST message:
  * If it has a grammar or word mistake, set "correction": {"original": their sentence, "fixed": the corrected natural sentence, "why_th": a very short Thai explanation (max 15 words)}. Do NOT lecture in "reply"; just continue the conversation.
  * Else if it is correct but sounds unnatural or textbook-like, set "natural": {"more_natural": what a native would say, "casual": a casual alternative or "", "why_th": short Thai explanation}.
  * If it is fine, both are null. Ignore capitalization and punctuation. If the learner writes Thai, reply in simple English and put the English way to say it in "natural.more_natural".
- "suggestions": 3 short replies the learner could say next, at their level, each with a DIFFERENT feel from: Casual, Friendly, Polite, Playful, Professional (Playful stays respectful). Use the studied patterns when they fit.

function aiProxyTurns(chat){
  const system=aiRules(chat);const hist=chat.msgs.slice(-HIST);
  if(!hist.length)return {system,messages:[{role:'user',content:'Open the conversation now with a short greeting and one question that fits the scenario. "correction" and "natural" must be null.'}]};
  const m=hist.map(x=>({role:x.r==='ai'?'assistant':'user',content:String(x.t).slice(0,600)}));
  if(m.length&&m[0].role!=='user')m.unshift({role:'user',content:'(Start the conversation.)'});
  if(!m.length||m[m.length-1].role!=='user')return null;return {system,messages:m};
}
function aiTurns(chat){
  const rules=aiRules(chat);const hist=chat.msgs.slice(-HIST);
  if(!hist.length)return [{role:'user',content:rules+'\n\nThe learner has not said anything yet. Open the conversation now with a short greeting and one question that fits the scenario. "correction" and "natural" must be null.'}];
  const turns=[{role:'user',content:rules}];
  hist.forEach(x=>turns.push({role:x.r==='ai'?'assistant':'user',content:x.t}));
  const last=turns[turns.length-1];
  if(last.role!=='user')return null;
  turns[turns.length-1]={role:'user',content:last.content+'\n\n(Reply with the JSON object only.)'};
  return turns;
}

    r.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){srBlocked=true;mic.hidden=true;toast('Voice input needs microphone access, which this view doesn’t allow. Type instead.')}};
    r.onend=()=>{dictRec=null;mic.classList.remove('rec');if(ci.dataset.ph)ci.placeholder=ci.dataset.ph;CR().classList.remove('listening');if(ci.value.trim())send.disabled=false};
    try{r.start();dictRec=r;mic.classList.add('rec');ci.dataset.ph=ci.placeholder;ci.placeholder='Listening…';CR().classList.add('listening')}catch(e){srBlocked=true;mic.hidden=true}

  if((b=t.closest('[data-reveal]'))){const w=b.closest('.reveal');$$('[hidden]',w).forEach(x=>{x.hidden=false;x.classList.add('pop-in')});b.remove();return}

  if((b=t.closest('[data-lv]'))){S.libLevel=b.dataset.lv;save();rerender();return}
  if((b=t.closest('.nav [data-go]'))||(b=t.closest('[data-go]'))){go(b.dataset.go);return}
  if((b=t.closest('[data-snd]'))){S.autoVoice=!S.autoVoice;save();if(!S.autoVoice)stopAudio();$$('[data-snd]').forEach(x=>{x.outerHTML=sndBtn()});toast(S.autoVoice?'เปิดเสียงแล้ว':'ปิดเสียง: กดลำโพงเมื่ออยากฟัง');if(S.autoVoice)say('Sound on');return}
  if((b=t.closest('#auto-voice'))){S.autoVoice=!S.autoVoice;save();b.setAttribute('aria-pressed',S.autoVoice);if(!S.autoVoice)stopAudio();toast(S.autoVoice?'เปิดอ่านออกเสียงอัตโนมัติ':'ปิดเสียงอัตโนมัติแล้ว');return}
  if((b=t.closest('#ai-save'))){S.aiUrl=$('#ai-url').value.trim();S.aiKeyApp=$('#ai-key').value.trim();aiDead=false;save();toast('Saved');return}
  if((b=t.closest('#ai-test'))){const st=$('#ai-status');S.aiUrl=$('#ai-url').value.trim();S.aiKeyApp=$('#ai-key').value.trim();save();aiDead=false;
    if(sampleFn){st.textContent='✓ Claude AI is on';return}if(!hasOwnAI()){st.textContent='Add a link first';return}st.textContent='Testing…';
    ownJSON('Reply with JSON {"reply":"OK"} only.',[{role:'user',content:'ping'}]).then(r=>{st.textContent=r&&r.reply?'✓ AI connected':'Unexpected reply'}).catch(e=>{st.textContent='✗ '+(e&&e.code==='bad_key'?'Blocked: check keys / App Check':e&&e.code==='rate_limited'?'Too many requests, wait 1 min':'Can’t reach AI')+(e&&(e.m||e.message)?' — '+String(e.m||e.message).slice(0,140):'')});return}
  if((b=t.closest('#bk-copy'))){let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}copyText(code,b);return}
  if((b=t.closest('#bk-restore'))){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bk-in').value.trim()))));if(!o||o.v!==1)throw 0;S=Object.assign(blank(),o);save();toast('Progress restored');go('home')}catch(e){toast('Backup code isn’t valid')}return}
  if((b=t.closest('#reset'))){if(b.dataset.armed){S=blank();save();toast('Progress reset');go('home');return}b.dataset.armed='1';b.textContent='Tap again to erase everything';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Reset all progress'}},4000)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!sheetEl.hidden)closeSheet();else if(!ovEl.hidden)closeOverlay()}});

/* ================= boot ================= */
const hmap={library:'learn',progress:'profile'};let h=(location.hash||'').slice(1);h=hmap[h]||h;
if(['home','words','learn','ai','play','progress','practice','saved','profile'].includes(h))route.tab=h;
render();
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
