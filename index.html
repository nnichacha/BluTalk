<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F0ED"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BluTalk"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<title>BluTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<style>
/* =====================================================================
   PatternSpeak design system v6
   Color: brand indigo (identity, selection, slots) · coral (actions, progress, streak)
          · one hue per category (--c) · soft violet-tinted neutrals
   Space: 2 4 6 8 10 12 16 20 28   Radius: 10 14 18 24   Motion: 150–300ms
   Type (mobile): 26 / 24 / 18 / 16 / 15 / 14 / 13 / 11
   ===================================================================== */
:root{
  --bg:#FAF7F3; --surface:#FFFFFF; --surface-2:#F4EEE8; --ink:#1F1B19; --ink-2:#5F5750; --ink-3:#9E958D;
  --line:#ECE4DC; --card-line:rgba(120,80,50,.08);
  --brand:#6F93C4; --brand-ink:#FFFFFF; --brand-soft:#E5EEF8; --brand-text:#3E6397;
  --accent:#9B5B34; --accent-ink:#FFFFFF; --accent-soft:#F4E7DC; --accent-text:#8A4C2A;
  --good:#4E9A74; --good-soft:#E4F2EA; --bad:#C0564A; --bad-soft:#F8E8E5; --gold:#C9A15C;
  --on-pastel:#1F1B19; --on-pastel-2:rgba(31,27,25,.62); --ring-track:rgba(31,27,25,.08);
  --primary:var(--brand); --primary-ink:#FFFFFF;
  --grad-brand:linear-gradient(135deg,#D3E3F5 0%,#EAF1FA 55%,#F5ECE3 100%);
  --grad-cta:linear-gradient(135deg,#A9693F 0%,#80472A 100%);
  --grad-prog:linear-gradient(90deg,#8FB0DC 0%,#A9693F 100%);
  --grad-ai:linear-gradient(135deg,#D7E6F6 0%,#EEF3F9 55%,#F4EAE0 100%);
  --grad-mint:linear-gradient(135deg,#7A9ED0 0%,#5379AE 100%);
  --grad-peach:linear-gradient(145deg,#F5ECE3 0%,#FBF8F4 100%);
  --press-cta:#5E3219; --press-blue:#3E5F8E;
  --sh-1:0 1px 2px rgba(80,50,30,.05),0 6px 18px -10px rgba(80,50,30,.16);
  --sh-2:0 2px 6px rgba(80,50,30,.06),0 18px 36px -18px rgba(80,50,30,.28);
  --sh-cta:0 10px 20px -10px rgba(128,71,42,.55);
  --sh-brand:0 12px 26px -14px rgba(83,121,174,.55);
  --icon-bg:#EAF0F8; --icon-fg:#3E6397;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --sec-gap:28px; --grp-gap:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.2,1.5,.4,1);
  --font:"Figtree","Noto Sans Thai Looped",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#171412; --surface:#221E1B; --surface-2:#2C2723; --ink:#F6F1EC; --ink-2:#C4BAB1; --ink-3:#8E847B;
  --line:#37302A; --card-line:rgba(255,230,210,.06);
  --brand:#9BB9E0; --brand-ink:#12223A; --brand-soft:#223044; --brand-text:#A9C6EC;
  --accent:#D08A5C; --accent-ink:#FFFFFF; --accent-soft:#3A2A20; --accent-text:#E3A67C;
  --good:#6CC495; --good-soft:#1B2E24; --bad:#E57F72; --bad-soft:#3A221F;
  --on-pastel:#F6F1EC; --on-pastel-2:rgba(246,241,236,.7); --ring-track:rgba(255,255,255,.12);
  --grad-brand:linear-gradient(135deg,#223246 0%,#232A35 55%,#35281F 100%);
  --grad-cta:linear-gradient(135deg,#B8764A 0%,#8E5431 100%);
  --grad-ai:linear-gradient(135deg,#223246 0%,#262B33 55%,#35281F 100%);
  --grad-mint:linear-gradient(135deg,#7A9ED0 0%,#5379AE 100%);
  --grad-peach:linear-gradient(145deg,#2D241E 0%,#241F1B 100%);
  --press-cta:#4A2715; --press-blue:#2E4A70;
  --icon-bg:#233044; --icon-fg:#A9C6EC;
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 6px 18px -8px rgba(0,0,0,.55); --sh-2:0 18px 38px -16px rgba(0,0,0,.7);
  --sh-brand:0 12px 26px -14px rgba(0,0,0,.7); --sh-cta:0 10px 20px -10px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171412; --surface:#221E1B; --surface-2:#2C2723; --ink:#F6F1EC; --ink-2:#C4BAB1; --ink-3:#8E847B;
  --line:#37302A; --card-line:rgba(255,230,210,.06);
  --brand:#9BB9E0; --brand-ink:#12223A; --brand-soft:#223044; --brand-text:#A9C6EC;
  --accent:#D08A5C; --accent-ink:#FFFFFF; --accent-soft:#3A2A20; --accent-text:#E3A67C;
  --good:#6CC495; --good-soft:#1B2E24; --bad:#E57F72; --bad-soft:#3A221F;
  --on-pastel:#F6F1EC; --on-pastel-2:rgba(246,241,236,.7); --ring-track:rgba(255,255,255,.12);
  --grad-brand:linear-gradient(135deg,#223246 0%,#232A35 55%,#35281F 100%);
  --grad-cta:linear-gradient(135deg,#B8764A 0%,#8E5431 100%);
  --grad-ai:linear-gradient(135deg,#223246 0%,#262B33 55%,#35281F 100%);
  --grad-mint:linear-gradient(135deg,#7A9ED0 0%,#5379AE 100%);
  --grad-peach:linear-gradient(145deg,#2D241E 0%,#241F1B 100%);
  --press-cta:#4A2715; --press-blue:#2E4A70;
  --icon-bg:#233044; --icon-fg:#A9C6EC;
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 6px 18px -8px rgba(0,0,0,.55); --sh-2:0 18px 38px -16px rgba(0,0,0,.7);
  --sh-brand:0 12px 26px -14px rgba(0,0,0,.7); --sh-cta:0 10px 20px -10px rgba(0,0,0,.6);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:12px}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.018em;text-wrap:balance;font-weight:700;line-height:1.3}
mark{background:var(--brand-soft);color:inherit;border-radius:4px;padding:0 2px}

/* ---------- background decoration ---------- */
.bg-deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-deco i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5}
.bg-deco .b1{width:300px;height:300px;left:-120px;top:-110px;background:radial-gradient(circle,rgba(115,80,245,.45),transparent 70%)}
.bg-deco .b2{width:260px;height:260px;right:-110px;top:40px;background:radial-gradient(circle,rgba(255,110,90,.32),transparent 70%)}
.bg-deco .b3{display:none;width:340px;height:340px;right:10%;bottom:-160px;background:radial-gradient(circle,rgba(31,207,193,.25),transparent 70%)}
.bg-deco .dots{position:absolute;left:0;right:0;top:0;height:320px;background-image:radial-gradient(color-mix(in srgb,var(--brand) 22%,transparent) 1px,transparent 1.5px);background-size:18px 18px;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),transparent);mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),transparent)}
@media (min-width:900px) and (prefers-reduced-motion:no-preference){
  .bg-deco .b3{display:block}
  .bg-deco .b1{animation:float 22s ease-in-out infinite alternate}
  .bg-deco .b2{animation:float 26s ease-in-out infinite alternate-reverse}
  .bg-deco .b3{animation:float 30s ease-in-out infinite alternate}
}
@keyframes float{to{transform:translate(40px,30px) scale(1.1)}}

/* ---------- layout ---------- */
.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-inline:16px;padding-block:10px calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:var(--sec-gap);animation:rise .3s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:var(--grp-gap)}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.page-head{display:flex;flex-direction:column;gap:4px}
.sec-title{display:flex;flex-direction:column;gap:2px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-sub{font-size:13.5px;color:var(--ink-3);line-height:1.45}
.t-sec + .meta,.t-sec + p.meta{margin-top:2px}
.link{color:var(--brand-text);font-weight:700;font-size:13.5px;padding:4px 0}

/* ---------- type ---------- */
.t-hero{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.022em}
.t-page{font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.02em}
.t-sec{font-size:18px;line-height:1.3;font-weight:700;letter-spacing:-.012em}
.t-card{font-size:16px;line-height:1.35;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:14.5px;line-height:1.5}
.meta{color:var(--ink-3);font-size:13px;font-weight:500;line-height:1.45}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.th{color:var(--ink-2);font-size:14.5px;line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.grad-text{background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:9px;background:var(--grad-brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:var(--sh-brand)}
.top-actions{display:flex;align-items:center;gap:8px}
.streak{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 11px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-1);font-size:13px;font-weight:800;border:1px solid var(--card-line)}
.streak .ic-inl{color:var(--accent);width:16px;height:16px;margin:0}
.streak.hot .ic-inl{animation:flicker 1.6s ease-in-out infinite}
@keyframes flicker{50%{transform:scale(1.15) rotate(-6deg)}}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-1);border:1px solid var(--card-line);display:grid;place-items:center;color:var(--ink-2)}
.avatar-btn svg{width:17px;height:17px}
.greet{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.greet .sub{margin-top:2px}
.subhead{display:flex;align-items:center;gap:6px;margin-left:-8px;min-height:40px}
.subhead .crumb{font-size:14px;font-weight:600;color:var(--ink-2)}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-md);font-weight:700;font-size:15.5px;transition:transform .15s var(--ease),box-shadow .2s,filter .2s,opacity .2s;user-select:none;-webkit-user-select:none;overflow:hidden}
.btn svg{width:18px;height:18px;flex:none;transition:transform .2s var(--ease)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn-accent{background:var(--grad-cta);color:var(--accent-ink);box-shadow:var(--sh-cta)}
.btn-primary{background:var(--grad-brand);color:#fff;box-shadow:var(--sh-brand)}
.btn-soft{background:var(--brand-soft);color:var(--brand-text)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-white{background:#fff;color:#3E2FD8;box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.btn-block{width:100%}
.btn-sm{min-height:40px;font-size:14.5px;padding:0 14px;border-radius:12px}
@media (hover:hover){.btn:hover:not(:disabled){filter:brightness(1.05)}.btn:hover:not(:disabled) svg:last-child{transform:translateX(2px)}}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:background .2s,transform .15s var(--ease),color .2s;position:relative}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.88)}
.icon-btn.sm{width:36px;height:36px}
.icon-btn.sm svg{width:18px;height:18px}
.say{color:var(--brand-text)}
.heart{color:var(--ink-3)}
.heart.on{color:var(--accent)}
.heart.on svg{fill:currentColor}
.heart.pop svg{animation:hpop .4s var(--spring)}
.heart.pop::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid var(--accent);animation:hring .45s ease-out forwards}
@keyframes hpop{40%{transform:scale(1.35)}}
@keyframes hring{from{transform:scale(.4);opacity:.9}to{transform:scale(1.4);opacity:0}}
.pill-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;background:var(--brand-soft);color:var(--brand-text);font-weight:700;font-size:14px;transition:transform .15s var(--ease)}
.pill-btn:active{transform:scale(.95)}
.pill-btn svg{width:16px;height:16px}
.pill-btn.plain{background:var(--surface-2);color:var(--ink-2)}
.pill-btn:disabled{opacity:.4}
/* waveform while audio plays */
.playing > svg{display:none}
.wave{display:inline-flex;align-items:center;gap:2px;height:16px}
.wave i{width:3px;height:100%;border-radius:2px;background:currentColor;animation:wave .9s ease-in-out infinite;transform-origin:center}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);border:1px solid var(--card-line)}
.pad{padding:16px}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);border:1px solid var(--card-line);overflow:hidden}
.search-field{display:flex;align-items:center;gap:10px;width:100%;height:46px;padding:0 14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sh-1);border:1px solid var(--card-line);color:var(--ink-3);font-size:14.5px;transition:box-shadow .2s}
.search-field svg{width:18px;height:18px;flex:none;color:var(--brand)}
.search-field:active{box-shadow:var(--sh-2)}

/* ---------- icons ---------- */
.ic-tile{flex:none;width:36px;height:36px;border-radius:11px;background:var(--icon-bg);color:var(--icon-fg);display:grid;place-items:center;transition:transform .2s var(--spring),background .2s,color .2s}
.ic-tile svg{width:19px;height:19px}
.ic-tile.sm{width:28px;height:28px;border-radius:9px}.ic-tile.sm svg{width:16px;height:16px}
.ic-tile.lg{width:40px;height:40px;border-radius:12px}.ic-tile.lg svg{width:21px;height:21px}
.ic-tile.xl{width:52px;height:52px;border-radius:16px}.ic-tile.xl svg{width:26px;height:26px}
.ic-tile.xxl{width:76px;height:76px;border-radius:24px;box-shadow:var(--sh-2)}.ic-tile.xxl svg{width:36px;height:36px}
.ic-tile.hue{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 82%,#000)}
.ic-tile.solid{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--c) 70%,transparent)}
.ic-tile.accent{background:var(--accent-soft);color:var(--accent-text)}
.ic-tile.brand{background:var(--grad-brand);color:#fff;box-shadow:var(--sh-brand)}
.ic-tile.ai{background:var(--grad-ai);color:#fff}
.ic-tile.good{background:var(--good);color:#fff}
.ic-inl{display:inline-flex;width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--ink-3)}
.ic-inl svg{width:100%;height:100%}
.h-ic{display:flex;align-items:center;gap:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic-tile.hue{background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 70%,#fff)}}
:root[data-theme="dark"] .ic-tile.hue{background:color-mix(in srgb,var(--c) 22%,var(--surface));color:color-mix(in srgb,var(--c) 70%,#fff)}

/* ---------- interactive surfaces ---------- */
.tile,.cat-tile,.feature,.row-main,.opt,.chip,.mode-tile{transition:transform .15s var(--ease),box-shadow .2s,background .2s,border-color .2s}
.tile:active,.cat-tile:active,.feature:active{transform:scale(.97)}
.row-main:active{background:var(--surface-2)}
@media (hover:hover){.tile:hover,.cat-tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}.tile:hover .ic-tile,.cat-tile:hover .ic-tile{transform:scale(1.06) rotate(-4deg)}}

/* ---------- home: journey hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--grad-brand);color:#fff;border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh-brand),inset 0 1px 0 rgba(255,255,255,.25)}
.hero::before{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,130,100,.55),transparent 65%);pointer-events:none}
.hero::after{content:"";position:absolute;width:160px;height:160px;left:-60px;bottom:-80px;border-radius:50%;border:24px solid rgba(255,255,255,.06);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:rgba(255,255,255,.72)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-frame{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin-top:6px}
.hero-th{color:rgba(255,255,255,.78);font-size:13.5px;margin-top:2px}
.hero .slot{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.ring,.ring svg{width:54px;height:54px;flex:none}
.ring{position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle.fill{transition:stroke-dashoffset .9s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.dots{display:flex;align-items:center;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .3s,transform .3s var(--spring)}
.dots i.on{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.dots i.next{background:transparent;box-shadow:inset 0 0 0 2px #fff;animation:breathe 1.8s ease-in-out infinite}
.dots span{margin-left:4px;font-size:13px;font-weight:700;color:rgba(255,255,255,.85)}
@keyframes breathe{50%{transform:scale(1.25)}}
.journey-mini{display:flex;flex-wrap:wrap;gap:3px 5px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.75)}
.journey-mini b{color:#fff;font-weight:800}
.plan-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.plan-chips::-webkit-scrollbar{display:none}
.plan-chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:12.5px;font-weight:600;border:1px solid rgba(255,255,255,.14)}
.plan-chip.done{opacity:.55;text-decoration:line-through}
.plan-chip small{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#FFD2C4}
.done-banner{display:flex;align-items:center;gap:12px}
.done-banner .ic-tile{background:rgba(255,255,255,.18);color:#fff}

/* journey steps strip */
.journey{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 6px;scrollbar-width:none;counter-reset:j}
.journey::-webkit-scrollbar{display:none}
.j-step{flex:none;display:flex;flex-direction:column;gap:6px;width:92px;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--sh-1)}
.j-step b{font-size:13px;font-weight:800}
.j-step span{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.j-step .n{font-size:10.5px;font-weight:800;color:var(--brand-text);letter-spacing:.04em}

/* ---------- category tiles ---------- */
.hscroll{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding:4px 16px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.cat-tile{--c:var(--brand);position:relative;overflow:hidden;flex:none;width:118px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:12px;border-radius:18px;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 13%,var(--surface)) 0%,var(--surface) 72%);border:1px solid color-mix(in srgb,var(--c) 18%,transparent);box-shadow:var(--sh-1);text-align:left}
.cat-tile .nm{position:relative;font-size:12.5px;font-weight:700;line-height:1.25;hyphens:auto;-webkit-hyphens:auto}
.cat-tile .deco{position:absolute;right:-12px;bottom:-12px;width:60px;height:60px;color:var(--c);opacity:.12;transform:rotate(-14deg);pointer-events:none}
.cat-tile .deco svg{width:100%;height:100%}
.recent-tile{width:176px;gap:4px}
.recent-tile .t-card{font-size:15px}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:2px;padding-right:4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 4px 11px 14px;text-align:left}
.row-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-en{font-size:15.5px;font-weight:600;letter-spacing:-.005em;line-height:1.4}
.row-th{font-size:14px;color:var(--ink-2);line-height:1.5}
.row-meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--ink-3);font-weight:500;margin-top:2px}
.row-alt{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.row-alt b{color:var(--ink-2);font-weight:600}
.chev{flex:none;color:var(--ink-3);width:18px;height:18px}
.state{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.state svg{width:12px;height:12px}
.state.learned{background:var(--good-soft);color:var(--good)}
.state.due{background:var(--accent-soft);color:var(--accent-text)}
.state.fresh{border:1.5px solid var(--line)}
.lvl{flex:none;font-size:12px;font-weight:700;color:var(--ink-3);padding-right:10px}
.stagger > *{animation:rise .35s var(--ease) both}
.stagger > *:nth-child(2){animation-delay:.04s}.stagger > *:nth-child(3){animation-delay:.08s}.stagger > *:nth-child(4){animation-delay:.12s}.stagger > *:nth-child(5){animation-delay:.16s}.stagger > *:nth-child(6){animation-delay:.2s}.stagger > *:nth-child(n+7){animation-delay:.24s}
.feature{display:flex;align-items:center;gap:12px;padding:11px 14px;text-align:left;width:100%;border-top:1px solid var(--line)}
.feature:first-child{border-top:0}
.feature .row-th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.feature-t{font-weight:700;font-size:15px;letter-spacing:-.01em}

/* ---------- grids & tiles ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{--c:var(--brand);display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:12px;min-height:64px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--sh-1);border:1px solid var(--card-line);text-align:left}
.tile .ic-tile{grid-row:1 / span 2}
.tile-name{font-size:14px;font-weight:700;line-height:1.3;letter-spacing:-.01em;align-self:end}
.tile-th{font-size:12px;color:var(--ink-3);line-height:1.35;align-self:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-head{display:flex;align-items:center;gap:10px}

/* ---------- category page ---------- */
.cat-hero{--c:var(--brand);position:relative;overflow:hidden;border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 20%,var(--surface)) 0%,var(--surface) 75%);border:1px solid color-mix(in srgb,var(--c) 20%,transparent);box-shadow:var(--sh-1)}
.cat-hero .deco{position:absolute;right:-18px;top:-10px;width:130px;height:130px;color:var(--c);opacity:.1;transform:rotate(-12deg)}
.cat-hero .deco svg{width:100%;height:100%}
.cat-hero > *{position:relative}
.path{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);flex-wrap:wrap}
.path span{display:inline-flex;align-items:center;gap:5px}
.path i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 80%,#000)}
.path .sep{color:var(--ink-3)}
.feat{--c:var(--brand);position:relative;overflow:hidden;border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent);box-shadow:var(--sh-2)}
.feat::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#FF7A45))}
.feat .frame{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.feat .ex{font-size:14px;color:var(--ink-2)}
.feat .ex b{color:var(--ink);font-weight:600}

/* ---------- segmented & chips ---------- */
.segmented{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.segmented::-webkit-scrollbar{display:none}
.segmented button{flex:1 0 auto;min-height:36px;padding:0 12px;border-radius:10px;font-size:13.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;text-align:center;transition:background .2s,color .2s,box-shadow .2s}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--brand-text);box-shadow:var(--sh-1)}
.filters{display:flex;gap:6px;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip-f{flex:none;height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s,transform .15s var(--ease)}
.chip-f:active{transform:scale(.95)}
.chip-f[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:var(--sh-brand)}
.opt-chips{display:flex;flex-wrap:wrap;gap:6px}
.opt-chips .chip-f{height:38px;padding:0 14px;font-size:14px}
.switch-row{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.switch{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--spring)}
.switch-row[aria-pressed="true"] .switch{background:var(--brand)}
.switch-row[aria-pressed="true"] .switch::after{transform:translateX(18px)}

/* ---------- stats & profile ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.stats > *{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-left:1px solid var(--line);text-align:left}
.stats > *:first-child{border-left:0}
.stats b{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink-2);line-height:1.3}
.big-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big-stat{padding:14px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.big-stat b{font-size:28px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-stat b small{font-size:14px;color:var(--ink-3);font-weight:650;letter-spacing:0}
.big-stat span{color:var(--ink-2);font-size:13px}
.big-stat.hl{background:var(--grad-brand);color:#fff;border:0}
.big-stat.hl span,.big-stat.hl b small{color:rgba(255,255,255,.8)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;padding:14px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);font-weight:650}
.week i{width:100%;max-width:32px;aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:transparent;font-style:normal}
.week i svg{width:14px;height:14px}
.week i.on{background:var(--grad-cta);color:#fff}
.week i.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.profile-head{display:flex;align-items:center;gap:12px}
.avatar-lg{width:52px;height:52px;border-radius:16px;background:var(--grad-brand);color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh-brand)}
.avatar-lg svg{width:24px;height:24px}
.level-row{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 14px;border-top:1px solid var(--line)}
.level-row:first-child{border-top:0}
.lv-label{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.lv-label.hi{color:var(--accent-text)}
.level-note{padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.more-btn{display:block;width:100%;padding:12px;font-weight:700;font-size:14px;color:var(--brand-text);border-top:1px solid var(--line);text-align:center}
.empty{color:var(--ink-3);font-size:14px;padding:20px 16px;border:1.5px dashed var(--line);border-radius:var(--r-lg);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink-2);font-size:15px}
.danger{color:var(--bad);font-weight:650;font-size:14px;padding:10px}
.note-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--ink-2)}

/* ---------- search ---------- */
.search-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:6px 16px 6px 8px;display:flex;align-items:center;gap:4px}
.search-wrap{position:relative;flex:1;display:flex}
.search-wrap svg{position:absolute;left:14px;top:14px;width:18px;height:18px;color:var(--brand);pointer-events:none}
.search-input{flex:1;min-width:0;height:46px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.sugs{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.nav-inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:10.5px;font-weight:650;color:var(--ink-3);transition:color .2s;text-align:center}
.nav .ic{width:48px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background .25s,transform .2s var(--spring)}
.nav svg{width:21px;height:21px}
.nav button:active .ic{transform:scale(.88)}
.nav button[aria-current="page"]{color:var(--brand-text)}
.nav button[aria-current="page"] .ic{background:var(--brand-soft)}
.nav button[data-go="ai"] .ic{background:var(--grad-ai);color:#fff;box-shadow:0 6px 14px -6px rgba(255,140,160,.5)}
.nav button[data-go="ai"][aria-current="page"] .ic{box-shadow:0 0 0 3px var(--brand-soft),0 6px 14px -6px rgba(255,140,160,.5)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slideup .28s var(--ease)}
@keyframes slideup{from{transform:translateY(24px);opacity:.3}to{transform:none;opacity:1}}
.o-head{flex:none;width:100%;max-width:640px;margin:0 auto;padding:8px 16px 4px;display:flex;align-items:center;gap:12px}
.o-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.o-inner{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:10px 24px;display:flex;flex-direction:column;gap:18px;animation:rise .28s var(--ease) both}
.o-foot{flex:none;width:100%;max-width:640px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.foot-hint{text-align:center;font-size:13px;color:var(--ink-3)}
.foot-links{display:flex;justify-content:center;gap:18px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad-prog);border-radius:99px;transition:width .5s var(--ease);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shimmer 2.2s ease-in-out infinite}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}

/* lesson stepper */
.stepper{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.stepper i{height:6px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.stepper i.done{background:var(--brand)}
.stepper i.cur{background:var(--line)}
.stepper i.cur::after{content:"";position:absolute;inset:0;background:var(--grad-prog);border-radius:9px;animation:grow .45s var(--ease) both}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
.step-label{max-width:640px;width:100%;margin:0 auto;padding:2px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.step-label b{font-size:13px;font-weight:800;color:var(--ink)}
.step-label b em{font-style:normal;color:var(--accent-text);margin-right:6px}
.step-label span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.dot{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.tag{display:inline-flex;align-items:center;height:22px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent-text)}
.tag.good{background:var(--good-soft);color:var(--good)}
.step-intro{display:flex;flex-direction:column;gap:2px}
.step-intro h2{font-size:19px;font-weight:800;letter-spacing:-.015em}

/* interactive pattern card */
.pcard{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px 18px 16px;background:var(--grad-brand);color:#fff;box-shadow:var(--sh-brand),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;display:flex;flex-direction:column;gap:6px;user-select:none;-webkit-user-select:none}
.pcard::before{content:"";position:absolute;width:200px;height:200px;right:-70px;bottom:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,130,100,.5),transparent 65%)}
.pcard > *{position:relative}
.pcard .eyebrow{color:rgba(255,255,255,.7)}
.pcard .pattern-big{color:#fff}
.pcard .slot{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.45)}
.pcard .slot.filled{background:#fff;color:#3E2FD8}
.pcard .meaning{color:rgba(255,255,255,.8);margin:0}
.pc-hint{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.85);margin-top:4px}
.pc-hint svg{width:15px;height:15px;animation:tapnudge 1.8s ease-in-out infinite}
@keyframes tapnudge{50%{transform:translateY(-2px)}}
.pcard:active{transform:scale(.99)}
.pattern-big{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.025em}
.meaning{font-size:16.5px;color:var(--ink-2);margin-top:-10px}

/* slot */
.slot{display:inline-block;padding:0 .35em;margin:0 .04em;border-radius:.4em;background:var(--brand-soft);color:var(--brand-text);border:1.5px dashed color-mix(in srgb,var(--brand) 45%,transparent);font-weight:700}
.slot.filled{border-style:solid;border-color:transparent;background:var(--grad-brand);color:#fff;animation:pop .3s var(--spring)}
.slot.roll{animation:roll .3s var(--ease)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@keyframes roll{from{transform:translateY(.55em);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}

/* build stage */
.stage{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--r-xl);padding:22px 16px 16px;box-shadow:var(--sh-2);border:1px solid var(--card-line);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.stage::before{content:"";position:absolute;inset:0 0 auto 0;height:90px;background:linear-gradient(180deg,var(--accent-soft),transparent);pointer-events:none}
.stage > *{position:relative}
.swap-frame{font-size:25px;font-weight:800;line-height:1.25;letter-spacing:-.025em}
.swap-th{color:var(--ink-2);font-size:15px;min-height:1.5em}
.audio-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);text-align:left}
.chip:active{transform:scale(.94)}
.chip b{font-weight:700;font-size:14.5px}
.chip small{font-size:11.5px;color:var(--ink-3)}
.chip.used{border-color:color-mix(in srgb,var(--brand) 28%,var(--line));background:color-mix(in srgb,var(--brand-soft) 45%,var(--surface))}
.chip.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.chip.sel small{color:var(--brand-text)}
.goal{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.goal .gdots{display:flex;gap:5px}
.goal .gdots i{width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .25s,transform .3s var(--spring)}
.goal .gdots i.on{background:var(--grad-prog);transform:scale(1.15)}
.made{display:flex;flex-wrap:wrap;gap:6px}
.made span{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}

/* mic */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.mic{width:72px;height:72px;border-radius:50%;background:var(--grad-brand);color:#fff;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative;transition:transform .15s var(--ease);box-shadow:var(--sh-brand)}
.mic svg{width:28px;height:28px}
.mic.sm{width:56px;height:56px}.mic.sm svg{width:23px;height:23px}
.mic.rec{transform:scale(1.08);background:var(--grad-cta);box-shadow:var(--sh-cta)}
.mic.rec::before,.mic.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--accent);opacity:.5;animation:ring 1.3s ease-out infinite}
.mic.rec::after{animation-delay:.45s}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.35);opacity:0}}
.mic-hint{font-size:13.5px;font-weight:650;color:var(--ink-2);min-height:1.5em;text-align:center}
.feedback{width:100%;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;animation:fbin .3s var(--spring) both}
@keyframes fbin{from{opacity:0;transform:translateY(8px) scale(.98)}}
.feedback.good{background:var(--good-soft)}
.feedback.almost{background:var(--accent-soft)}
.feedback.retry,.feedback.self{background:var(--surface-2)}
.fb-title{display:flex;align-items:center;gap:8px;font-size:16.5px;font-weight:800;letter-spacing:-.015em}
.fb-title .ic-tile{width:28px;height:28px;border-radius:50%}
.fb-title .ic-tile svg{width:16px;height:16px}
.feedback.good .fb-title{color:var(--good)}
.feedback.almost .fb-title{color:var(--accent-text)}
.fb-checks{display:flex;flex-wrap:wrap;gap:6px}
.fb-checks span{font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;background:var(--surface);color:var(--ink-2)}
.fb-checks span.ok{color:var(--good)}
.fb-heard{font-size:13.5px;color:var(--ink-2)}
.fb-heard q{color:var(--ink);font-weight:650}
.self-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mic-note{font-size:12px;color:var(--ink-3);text-align:center;max-width:36ch}
.check-draw path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .4s .05s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* speak */
.target{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--r-xl);padding:22px 16px;box-shadow:var(--sh-2);border:1px solid var(--card-line);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.target .big{font-size:23px;font-weight:800;line-height:1.25;letter-spacing:-.025em}
.pager{font-size:12.5px;font-weight:650;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}

/* scripted chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:rise .3s var(--ease) both}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.avatar{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:11px;color:var(--ink-2)}
.me .avatar{background:var(--grad-brand);color:#fff}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh-1)}
.me .bubble{border-radius:18px 18px 6px 18px;background:var(--brand-soft);border-color:transparent;box-shadow:none}
.bubble .who{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.bubble .en{font-size:15.5px;font-weight:650}
.bubble-row{display:flex;align-items:center;gap:6px}
.sample{font-size:13.5px;color:var(--ink-2);text-align:center}
.sample b{color:var(--ink)}
.scene-intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:12px}

/* quizzes */
.q-card{background:var(--surface);border-radius:var(--r-xl);padding:18px 16px;box-shadow:var(--sh-2);border:1px solid var(--card-line);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.q-prompt{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;padding:6px 0}
.q-big{font-size:21px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);text-align:left;font-size:15px;font-weight:600;box-shadow:var(--sh-1)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2);transition:background .2s,color .2s}
.opt.right{border-color:var(--good);background:var(--good-soft);animation:pop .35s var(--spring)}
.opt.right .key{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.shake{animation:shake .4s ease}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.explain{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;animation:fbin .3s var(--spring) both}
.explain.ok{background:var(--good-soft)}
.explain.no{background:var(--bad-soft)}
.explain .fb-title{font-size:16px}
.explain.ok .fb-title{color:var(--good)}
.explain.no .fb-title{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-weight:650}
.kv dd{margin:0;color:var(--ink)}
.result-big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}

/* review summary */
.summary{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:6px}
.badge-pop{animation:badge .6s var(--spring) both}
@keyframes badge{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.levelup{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:linear-gradient(135deg,#FFB020,#FF6B4A);color:#fff;font-weight:800;font-size:13.5px;box-shadow:0 10px 22px -10px rgba(255,120,40,.7);animation:badge .6s .2s var(--spring) both}
.levelup svg{width:16px;height:16px}
.sum-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.sum-stats div{background:var(--surface);border:1px solid var(--card-line);border-radius:14px;padding:10px;box-shadow:var(--sh-1)}
.sum-stats b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.sum-stats span{font-size:11.5px;color:var(--ink-3);font-weight:600}

/* celebration burst */
.burst{position:fixed;z-index:80;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:2px;animation:burst .8s cubic-bezier(.15,.7,.3,1) forwards}
.burst i:nth-child(3n){border-radius:50%}
@keyframes burst{from{transform:translate(0,0) scale(1) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.4) rotate(220deg);opacity:0}}

/* ---------- sheet ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(14,10,40,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-width:640px;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:sheetup .3s var(--ease) both}
@keyframes sheetup{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto;flex:none}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sit-chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-1);font-size:12.5px;font-weight:650;color:var(--ink-2)}
.sheet-en{font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:3px}
.fact .eyebrow{font-size:10px}
.fact b{font-size:14px;font-weight:700}
.fact.wide{grid-column:1/-1}

/* ---------- AI setup ---------- */
.ai-hero{--c:#6F93C4;position:relative;overflow:hidden;border-radius:var(--r-xl);padding:18px;background:var(--grad-ai);color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 16px 34px -16px rgba(58,120,245,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.ai-hero::after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.ai-hero h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.ai-hero p{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:2px}
.orb{--c:#6F93C4;position:relative;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 42%),linear-gradient(145deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c));box-shadow:0 10px 24px -10px color-mix(in srgb,var(--c) 80%,transparent),inset 0 -4px 10px rgba(0,0,0,.12);animation:orb 3.6s ease-in-out infinite}
.orb svg{width:26px;height:26px}
.orb::before,.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 45%,#fff);opacity:0}
.orb.live::before{animation:orbring 2.4s ease-out infinite}
.orb.live::after{animation:orbring 2.4s 1.2s ease-out infinite}
.orb.speaking{animation:orbtalk .5s ease-in-out infinite alternate}
.orb.speaking::before{animation:orbring 1s ease-out infinite}
.orb.sm{width:34px;height:34px}.orb.sm svg{width:17px;height:17px}
.ai-hero .orb{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.7),transparent 45%),rgba(255,255,255,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.ai-hero .orb::before,.ai-hero .orb::after{border-color:rgba(255,255,255,.6)}
@keyframes orb{50%{transform:translateY(-3px) scale(1.03)}}
@keyframes orbtalk{from{transform:scale(1)}to{transform:scale(1.1)}}
@keyframes orbring{from{transform:scale(.9);opacity:.8}to{transform:scale(1.5);opacity:0}}
.mode-tile{--c:var(--brand)}
.mode-tile[aria-pressed="true"]{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent),var(--sh-2)}
.mode-tile[aria-pressed="true"] .ic-tile{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));color:#fff;transform:scale(1.05)}
.mode-tile .tile-th{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.preview{--c:var(--brand);position:relative;overflow:hidden;border-radius:var(--r-xl);padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 16%,var(--surface)) 0%,var(--surface) 70%);border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent);box-shadow:var(--sh-2);transition:background .3s,border-color .3s}
.preview-head{display:flex;align-items:center;gap:12px}
.preview-head b{display:block;font-size:15.5px;font-weight:800}
.preview-head span{font-size:12.5px;color:var(--ink-3);font-weight:600}
.preview-q{align-self:flex-start;max-width:90%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--card-line);font-size:15px;box-shadow:var(--sh-1);animation:rise .35s var(--ease) both}

/* ---------- AI chat ---------- */
.chat-head{border-bottom:1px solid var(--line);padding-bottom:8px;max-width:none;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chat-title{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;line-height:1.3;min-width:0}
.chat-title > div{display:flex;flex-direction:column;min-width:0}
.chat-title b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title span{font-size:12px;color:var(--ink-3);font-weight:500}
.voice-t[aria-pressed="true"]{color:var(--brand-text);background:var(--brand-soft)}
.chat-inner{gap:0;padding-block:14px 12px}
.thread{display:flex;flex-direction:column;gap:10px}
.chat-intro{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:8px}
.focus-chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-text);font-size:12px;font-weight:650}
.m{display:flex;flex-direction:column;max-width:85%;gap:4px;animation:msgin .28s var(--ease) both}
@keyframes msgin{from{opacity:0;transform:translateY(10px) scale(.98)}}
.m.ai{align-self:flex-start;align-items:flex-start}
.m.me{align-self:flex-end;align-items:flex-end}
.m-bubble{padding:9px 13px;font-size:15.5px;line-height:1.45;border-radius:18px;white-space:pre-wrap;word-break:break-word}
.ai .m-bubble{background:var(--surface);border:1px solid var(--card-line);border-bottom-left-radius:6px;box-shadow:var(--sh-1)}
.me .m-bubble{background:var(--grad-brand);color:#fff;border-bottom-right-radius:6px;box-shadow:var(--sh-brand)}
.m-tools{display:flex;gap:4px;align-items:center;margin-left:2px}
.tr-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:650}
.tr-btn svg{width:15px;height:15px}
.tr-btn[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text)}
.m-th{font-size:14px;color:var(--ink-2);padding:0 6px;line-height:1.6;animation:rise .25s var(--ease) both}
.typing-row{display:flex;align-items:flex-end;gap:8px}
.typing{display:flex;gap:5px;align-items:center;min-height:40px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--brand);opacity:.6;animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.fix-card{display:flex;flex-direction:column;gap:6px;text-align:left;border-radius:14px;padding:9px 12px;font-size:14px;max-width:100%;cursor:pointer;line-height:1.5;animation:fbin .3s var(--spring) both}
.fix-card.fix{background:var(--good-soft)}
.fix-card.nat{background:var(--brand-soft)}
.fix-head{display:flex;align-items:flex-start;gap:8px;font-weight:600;flex-wrap:wrap}
.fix-card.fix .fix-head svg{width:18px;height:18px;color:var(--good);flex:none;margin-top:2px}
.fix-ok{color:var(--good);font-weight:700}
.fix-more{font-size:12px;color:var(--ink-3)}
.fix-body{display:flex;flex-direction:column;gap:2px;padding-top:6px;border-top:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.fix-k{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.fix-body s{color:var(--ink-3)}
.fix-act{display:flex;gap:2px;margin-top:4px}
.chat-err{align-self:center;text-align:center;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:14px;padding:10px 14px;max-width:92%}
.chat-foot{border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);gap:8px;max-width:none}
.chat-foot > *{max-width:600px;width:100%;margin:0 auto}
.sugs-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sugs-row:empty{display:none}
.sugs-row::-webkit-scrollbar{display:none}
.sug{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--brand) 30%,var(--line));font-size:14px;font-weight:600;white-space:nowrap;animation:rise .3s var(--ease) both;transition:transform .15s var(--ease)}
.sug:nth-child(2){animation-delay:.05s}.sug:nth-child(3){animation-delay:.1s}
.sug:active{transform:scale(.95)}
.sug.ghost{border-style:dashed;color:var(--ink-2)}
.sug svg{width:16px;height:16px;color:var(--brand)}
.composer{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:4px;box-shadow:var(--sh-1);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.composer textarea{flex:1;min-width:0;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:1.45;padding:8px 6px;max-height:132px;color:var(--ink)}
.c-btn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .15s var(--ease),opacity .2s}
.c-btn svg{width:20px;height:20px}
.c-btn:active{transform:scale(.9)}
.mic-btn{background:var(--surface-2);color:var(--ink-2)}
.mic-btn.rec{background:var(--grad-cta);color:#fff;animation:pulse 1s ease infinite}
.send-btn{background:var(--grad-cta);color:#fff;box-shadow:var(--sh-cta)}
.send-btn:disabled{opacity:.35;box-shadow:none}
@keyframes pulse{50%{transform:scale(1.1)}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;font-size:14px;font-weight:650;z-index:60;max-width:calc(100% - 40px);text-align:center;animation:fbin .25s var(--spring) both}

/* ---------- tablet & desktop ---------- */
@media (min-width:600px){
  body{font-size:16px}
  :root{--sec-gap:32px;--grp-gap:12px}
  .app{padding-inline:24px;padding-top:24px}
  .t-hero{font-size:30px}.t-page{font-size:28px}.t-sec{font-size:20px}.t-card{font-size:17px}
  .row-en{font-size:16px}.row-th{font-size:14.5px}
  .hscroll,.filters,.journey{margin-inline:-24px;padding-inline:24px}
  .cat-tile{width:116px}
  .grid2{grid-template-columns:repeat(3,1fr)}
  .hero{padding:22px}.hero-frame{font-size:24px}
  .pattern-big{font-size:36px}
}
@media (min-width:900px){
  .app{max-width:720px}
  .t-hero{font-size:34px}.t-page{font-size:30px}
  .o-inner,.o-head,.o-foot,.sheet,.step-label{max-width:680px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* =====================================================================
   v7 · Soft pastel theme — mint identity, peach/pink actions, dark text on pastel
   ===================================================================== */
.bg-deco .b1{background:radial-gradient(circle,rgba(155,185,224,.55),transparent 70%)}
.bg-deco .b2{background:radial-gradient(circle,rgba(200,150,110,.32),transparent 70%)}
.bg-deco .b3{background:radial-gradient(circle,rgba(155,185,224,.4),transparent 70%)}
.bg-deco .dots{background-image:radial-gradient(color-mix(in srgb,var(--accent) 30%,transparent) 1px,transparent 1.5px)}
.brand-mark{background:var(--ink);color:var(--bg);box-shadow:var(--sh-1)}
.btn-accent{background:var(--grad-cta);color:var(--accent-ink)}
.btn-primary{background:var(--grad-mint);color:#fff}
.btn-white{background:var(--surface);color:var(--brand-text)}
.search-field svg,.search-wrap svg{color:var(--accent)}
.search-input:focus{border-color:var(--brand)}
/* hero & pattern card: pastel with dark text */
.hero,.pcard{color:var(--on-pastel);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.6)}
.hero::before,.pcard::before{background:radial-gradient(circle,rgba(200,150,110,.35),transparent 65%)}
.hero::after{border-color:rgba(255,255,255,.35)}
.hero .eyebrow,.pcard .eyebrow{color:var(--brand-text)}
.hero-th,.pcard .meaning,.pc-hint,.journey-mini,.dots span{color:var(--on-pastel-2)}
.journey-mini b{color:var(--on-pastel)}
.hero .slot,.pcard .slot{background:rgba(255,255,255,.65);color:var(--brand-text);border-color:color-mix(in srgb,var(--brand) 50%,transparent)}
.pcard .slot.filled{background:var(--grad-mint);color:#fff;border-color:transparent}
.pcard .pattern-big{color:var(--on-pastel)}
.dots i{background:rgba(46,43,54,.10)}
.dots i.on{background:var(--accent);box-shadow:0 0 0 3px rgba(155,91,52,.18)}
.dots i.next{box-shadow:inset 0 0 0 2px var(--accent)}
.plan-chip{background:rgba(255,255,255,.6);color:var(--on-pastel);border-color:rgba(255,255,255,.7)}
.plan-chip small{color:var(--accent-text)}
.done-banner .ic-tile{background:rgba(255,255,255,.7);color:var(--accent-text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .slot,:root:not([data-theme="light"]) .pcard .slot,:root:not([data-theme="light"]) .plan-chip{background:rgba(255,255,255,.08)}:root:not([data-theme="light"]) .dots i{background:rgba(255,255,255,.14)}}
:root[data-theme="dark"] .hero .slot,:root[data-theme="dark"] .pcard .slot,:root[data-theme="dark"] .plan-chip{background:rgba(255,255,255,.08)}
:root[data-theme="dark"] .dots i{background:rgba(255,255,255,.14)}
/* slots, chips, selection */
.slot{background:var(--brand-soft);color:var(--brand-text);border-color:color-mix(in srgb,var(--brand) 55%,transparent)}
.slot.filled{background:var(--grad-mint);color:#fff}
.chip-f[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text);border-color:color-mix(in srgb,var(--brand) 55%,transparent);box-shadow:none}
.chip.sel{border-color:var(--brand);background:var(--brand-soft)}
.chip.used{border-color:color-mix(in srgb,var(--brand) 30%,var(--line));background:color-mix(in srgb,var(--brand-soft) 50%,var(--surface))}
.segmented button[aria-pressed="true"]{color:var(--brand-text)}
.switch-row[aria-pressed="true"] .switch{background:var(--brand)}
.stepper i.done{background:var(--brand)}
/* icons */
.ic-tile.solid{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 28%,#fff),color-mix(in srgb,var(--c) 52%,#fff));color:color-mix(in srgb,var(--c) 62%,#1d1b22);box-shadow:0 6px 14px -8px color-mix(in srgb,var(--c) 70%,transparent)}
.ic-tile.brand{background:var(--grad-mint);color:#fff}
.ic-tile.ai{background:var(--grad-ai);color:var(--brand-text)}
.ic-tile.good{background:var(--good);color:#fff}
.cat-tile{background:linear-gradient(165deg,color-mix(in srgb,var(--c) 16%,var(--surface)) 0%,var(--surface) 75%)}
.cat-tile .deco{opacity:.16}
.mode-tile[aria-pressed="true"] .ic-tile{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 30%,#fff),color-mix(in srgb,var(--c) 55%,#fff));color:color-mix(in srgb,var(--c) 62%,#1d1b22)}
/* mic, bubbles, buttons */
.mic{background:var(--grad-mint);color:#fff}
.mic.rec{background:var(--grad-cta);color:var(--accent-ink)}
.me .m-bubble{background:var(--grad-mint);color:#fff;box-shadow:var(--sh-brand)}
.me .avatar{background:var(--grad-mint);color:#fff}
.me .bubble{background:var(--brand-soft)}
.send-btn{background:var(--grad-cta);color:var(--accent-ink)}
.mic-btn.rec{background:var(--grad-cta);color:var(--accent-ink)}
.nav button[aria-current="page"]{color:var(--brand-text)}
.nav button[data-go="ai"] .ic{background:var(--grad-cta);color:#fff;box-shadow:var(--sh-cta)}
.week i.on{background:var(--grad-mint);color:#fff}
.avatar-lg{background:var(--ink);color:var(--bg)}
.big-stat.hl{background:var(--grad-brand);color:var(--on-pastel)}
.big-stat.hl span,.big-stat.hl b small{color:var(--on-pastel-2)}
.levelup{background:linear-gradient(135deg,#D9B06C,#A9693F);color:#fff}
.typing i{background:var(--brand)}
/* AI */
.ai-hero{background:var(--grad-ai);color:var(--on-pastel);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.6)}
.ai-hero p{color:var(--on-pastel-2)}
.ai-hero::after{background:radial-gradient(circle,rgba(200,150,110,.35),transparent 65%)}
.ai-hero .orb{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.7),transparent 45%),linear-gradient(145deg,#8FB0DC,#5379AE);color:#fff;box-shadow:0 10px 22px -12px rgba(83,121,174,.8)}
.ai-hero .orb::before,.ai-hero .orb::after{border-color:rgba(111,147,196,.6)}
.orb{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9),transparent 45%),linear-gradient(145deg,color-mix(in srgb,var(--c) 30%,#fff),color-mix(in srgb,var(--c) 58%,#fff));color:color-mix(in srgb,var(--c) 60%,#1d1b22)}
.orb::before,.orb::after{border-color:color-mix(in srgb,var(--c) 50%,#fff)}
/* phrase of the day */
.potd{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:16px;background:var(--grad-peach);border:1px solid var(--card-line);box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:6px}
.potd > *{position:relative}
.potd .eyebrow{color:var(--accent-text)}
.potd-deco{position:absolute!important;right:-14px;top:-12px;width:96px;height:96px;color:var(--accent);opacity:.14;transform:rotate(10deg)}
.potd-deco svg{width:100%;height:100%}
.potd-en{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.potd-when{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:2px}
.potd-when .ic-inl{color:var(--accent)}
.potd-act{display:flex;align-items:center;gap:6px;margin-top:4px}
.potd-act .link{margin-left:auto}
.pill-btn{background:var(--brand-soft);color:var(--brand-text)}
/* path */
.path-card{display:flex;flex-direction:column;gap:12px}
.trail{display:flex;flex-direction:column;position:relative}
.trail::before{content:"";position:absolute;left:15px;top:18px;bottom:18px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px)}
.trail-item{position:relative;display:flex;align-items:center;gap:12px;padding:8px 0;text-align:left;border-radius:12px;transition:transform .15s var(--ease)}
.trail-item:active{transform:scale(.98)}
.trail-dot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);border:2px solid var(--surface)}
.trail-dot svg{width:15px;height:15px}
.trail-item:first-child .trail-dot{background:var(--grad-cta);color:var(--accent-ink);animation:breathe 2.2s ease-in-out infinite}
.trail .row-en{font-size:15px}
.trail .row-th{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =====================================================================
   v8 · Blue Frost + caramel brown + white, near-black type · tactile controls
   ===================================================================== */
.t-hero,.t-page{color:var(--ink)}
.hero .eyebrow,.pcard .eyebrow,.potd .eyebrow{color:var(--accent-text)}
.hero-frame,.pcard .pattern-big{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero-frame,:root:not([data-theme="light"]) .pcard .pattern-big{color:var(--on-pastel)}}
:root[data-theme="dark"] .hero-frame,:root[data-theme="dark"] .pcard .pattern-big{color:var(--on-pastel)}
/* tactile, pressable buttons */
.btn-accent{box-shadow:0 4px 0 var(--press-cta),var(--sh-cta)}
.btn-accent:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--press-cta),0 4px 10px -6px rgba(128,71,42,.5)}
.btn-primary{box-shadow:0 4px 0 var(--press-blue),var(--sh-brand)}
.btn-primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--press-blue)}
.btn-soft,.btn-ghost,.pill-btn{box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 10%,transparent)}
.btn-soft:active,.btn-ghost:active,.pill-btn:active{transform:translateY(2px);box-shadow:none}
.chip,.opt,.chip-f{box-shadow:0 2px 0 var(--line)}
.chip:active,.opt:active:not(:disabled),.chip-f:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
.chip.sel{box-shadow:0 2px 0 color-mix(in srgb,var(--brand) 55%,transparent)}
.opt.right{box-shadow:0 2px 0 color-mix(in srgb,var(--good) 55%,transparent)}
.opt.wrong{box-shadow:0 2px 0 color-mix(in srgb,var(--bad) 45%,transparent)}
.tile,.cat-tile,.mode-tile{box-shadow:0 3px 0 color-mix(in srgb,var(--c) 22%,var(--line)),var(--sh-1)}
.tile:active,.cat-tile:active,.mode-tile:active{transform:translateY(3px);box-shadow:0 0 0 transparent,var(--sh-1)}
.chip-f[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 0 var(--press-blue)}
.segmented button[aria-pressed="true"]{color:var(--brand-text)}
.send-btn{background:var(--grad-cta);color:#fff;box-shadow:0 3px 0 var(--press-cta)}
.send-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--press-cta)}
.mic{box-shadow:0 5px 0 var(--press-blue),var(--sh-brand)}
.mic.rec{box-shadow:0 2px 0 var(--press-cta),var(--sh-cta);color:#fff}
.mic-btn.rec{color:#fff}
/* white cards with blue/brown details */
.potd{background:var(--grad-peach)}
.potd-deco{color:var(--accent)}
.potd-when .ic-inl{color:var(--accent)}
.trail-item:first-child .trail-dot{background:var(--grad-cta);color:#fff}
.stage::before{background:linear-gradient(180deg,var(--brand-soft),transparent)}
.search-field svg,.search-wrap svg{color:var(--brand-text)}
.link{color:var(--accent-text)}
.sug{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.sug svg{color:var(--accent)}
.feat::before{background:linear-gradient(90deg,var(--c),var(--accent))}
.tag.accent{background:var(--accent-soft);color:var(--accent-text)}
.lv-label.hi{color:var(--accent-text)}
.dots i.next{box-shadow:inset 0 0 0 2px var(--accent)}

/* =====================================================================
   v9 · Solid colors only (no gradients) · one standout CTA color
   ===================================================================== */
:root{
  --cta-bg:#1F1B19; --cta-ink:#FFFFFF; --cta-press:#000000;
  --grad-brand:#DCE8F6; --grad-ai:#DCE8F6; --grad-peach:#F4ECE3;
  --grad-cta:var(--cta-bg); --grad-prog:#A9693F; --grad-mint:#6F93C4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cta-bg:#F6F1EC; --cta-ink:#1F1B19; --cta-press:#9E958D;
  --grad-brand:#243448; --grad-ai:#243448; --grad-peach:#2D241E;
  --grad-cta:var(--cta-bg); --grad-prog:#D08A5C; --grad-mint:#6F93C4;
}}
:root[data-theme="dark"]{
  --cta-bg:#F6F1EC; --cta-ink:#1F1B19; --cta-press:#9E958D;
  --grad-brand:#243448; --grad-ai:#243448; --grad-peach:#2D241E;
  --grad-cta:var(--cta-bg); --grad-prog:#D08A5C; --grad-mint:#6F93C4;
}
/* no fades or glows */
.bg-deco{display:none}
.hero::before,.pcard::before,.ai-hero::after,.stage::before,.bar i::after{display:none}
.hero::after{border-color:rgba(255,255,255,.45)}
.cat-tile{background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.cat-hero{background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.preview{background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.feat::before{background:var(--c)}
.ic-tile.solid{background:color-mix(in srgb,var(--c) 42%,#fff);color:color-mix(in srgb,var(--c) 55%,#141210);box-shadow:none}
.mode-tile[aria-pressed="true"] .ic-tile{background:color-mix(in srgb,var(--c) 45%,#fff);color:color-mix(in srgb,var(--c) 55%,#141210)}
.orb{background:color-mix(in srgb,var(--c) 45%,#fff);color:color-mix(in srgb,var(--c) 55%,#141210);box-shadow:0 8px 18px -12px color-mix(in srgb,var(--c) 80%,transparent)}
.ai-hero .orb{background:#6F93C4;color:#fff;box-shadow:none}
.levelup{background:#A9693F;color:#fff}
.dots i.on{background:#A9693F}
/* THE primary action: solid near-black, nothing else uses it */
.btn-accent{background:var(--cta-bg);color:var(--cta-ink);box-shadow:0 4px 0 var(--cta-press),0 10px 22px -10px rgba(0,0,0,.45);letter-spacing:.005em}
.btn-accent:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--cta-press),0 4px 10px -6px rgba(0,0,0,.4)}
.btn-accent svg{color:#9BB9E0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-accent svg{color:#5379AE}}
:root[data-theme="dark"] .btn-accent svg{color:#5379AE}
.send-btn{background:var(--cta-bg);color:var(--cta-ink);box-shadow:0 3px 0 var(--cta-press)}
.send-btn:active{box-shadow:0 1px 0 var(--cta-press)}
/* secondary things stay blue / brown so the CTA stands alone */
.nav button[data-go="ai"] .ic{background:#6F93C4;color:#fff;box-shadow:0 3px 0 var(--press-blue)}
.trail-item:first-child .trail-dot{background:#A9693F;color:#fff}
.mic.rec,.mic-btn.rec{background:#A9693F;color:#fff;box-shadow:0 2px 0 var(--press-cta)}
.week i.on{background:#6F93C4}
.me .m-bubble,.me .avatar,.slot.filled,.pcard .slot.filled,.mic,.ic-tile.brand,.btn-primary{background:#6F93C4}

/* ===== v10 · Work Email ===== */
.e-home{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--card-line);box-shadow:0 3px 0 var(--line),var(--sh-1);text-align:left;transition:transform .15s var(--ease)}
.e-home:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.e-home .ic-tile.solid{background:#4F86C6;color:#fff}
.e-home-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.e-home-t b{font-size:15.5px;color:var(--ink)}
.e-home-t>span:first-of-type{font-size:12.5px;color:var(--ink-2)}
.e-home-bar,.tile-prog{display:block;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.e-home-bar i,.tile-prog i{display:block;height:100%;background:#4F86C6;border-radius:9px;transition:width .5s var(--ease)}
.tile-prog{width:100%;margin-top:6px}.tile-prog i{background:var(--c)}
.e-banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-lg);background:var(--brand-soft)}
.e-banner .ic-tile.solid{background:#4F86C6;color:#fff}.e-banner b{font-size:15px}
.e-prog{display:flex;align-items:center;gap:10px}.e-prog .bar{flex:1}
.e-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left}.e-link>span{flex:1;display:flex;flex-direction:column;gap:2px}
.e-tip{display:flex;gap:8px;align-items:flex-start;padding:11px 13px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-text);font-size:13.5px;line-height:1.55}
.e-tip .ic-inl{margin-top:2px}
/* tone chips */
.tone-row{display:flex;gap:6px;flex-wrap:wrap}
.tone-chip{min-height:34px;padding:0 13px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2);transition:transform .15s var(--ease),background .2s,border-color .2s,color .2s}
.tone-chip:active{transform:scale(.95)}
.tone-chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* builder parts */
.eb-part{display:flex;flex-direction:column;gap:8px}
.eb-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.eb-label b{font-size:14.5px}
.eb-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-size:11.5px;font-weight:800;font-style:normal;background:var(--surface-2);color:var(--ink)}
.eb-opts{display:flex;flex-direction:column;gap:6px}
.eb-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);text-align:left;font-size:14px;line-height:1.4;color:var(--ink);transition:transform .15s var(--ease),border-color .2s,background .2s}
.eb-opt:active{transform:scale(.985)}
.eb-opt small{flex:none;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.eb-opt.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 2px 0 var(--brand)}
.eb-opt.on small{color:var(--brand-text)}
.mk-open{--mk:#6F93C4}.mk-main{--mk:#A9693F}.mk-att,.mk-det{--mk:#5A97A3}.mk-close{--mk:#C49A52}
.eb-n.mk-open,.eb-n.mk-main,.eb-n.mk-att,.eb-n.mk-det,.eb-n.mk-close{background:var(--mk);color:#fff}
/* mail preview */
.mail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.mail-row{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.mail-row span{width:58px;flex:none;color:var(--ink-3);font-weight:600}.mail-row b{font-weight:650;min-width:0;overflow-wrap:anywhere}
.mail-body{padding:14px;font-size:14.5px;line-height:1.65;color:var(--ink);user-select:text;-webkit-user-select:text}
.mail-body p{margin:0 0 10px}.mail-body p:last-child{margin:0}
.mk{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--mk) 22%,transparent) 0);border-radius:2px}
.mk.flash{animation:mkflash .6s var(--ease)}
@keyframes mkflash{0%{background-color:color-mix(in srgb,var(--mk) 30%,transparent)}100%{background-color:transparent}}
/* fields */
.e-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.e-field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--ink-2)}
.e-field input{height:42px;padding:0 12px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:500;min-width:0}
.e-field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.copied{background:var(--good)!important;color:#fff!important}
/* before/after + ladder */
.ba{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.list .ba:last-child{border-bottom:0}
section>.ba{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.ba-bad,.ba-good{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.45}
.ba-bad s{color:var(--ink-3);text-decoration-color:var(--bad)}
.ba-good .e-line{flex:1}
.ba-tag{flex:none;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:6px;margin-top:1px}
.ba-bad .ba-tag{background:var(--bad-soft);color:var(--bad)}.ba-good .ba-tag{background:var(--good-soft);color:var(--good)}
.e-line{display:flex;align-items:center;gap:8px;justify-content:space-between}.e-line .row-en{flex:1}
.ladder{display:flex;flex-direction:column;gap:8px}
.ladder-step{padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--card-line);box-shadow:var(--sh-1);border-left:4px solid color-mix(in srgb,#5A97A3 calc(40% + var(--lv)*30%),var(--line));display:flex;flex-direction:column;gap:6px}
.ladder-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ladder-head b{font-size:15px}
.ladder-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#5A97A3;color:#fff;font-size:12px;font-weight:800}
.ladder-step .th{margin:0;font-size:13px;color:var(--ink-2)}
.avoid-row{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid var(--line)}.avoid-row:last-child{border-bottom:0}
.avoid-row s{text-decoration-color:var(--bad);color:var(--ink-2);font-size:14px}
.e-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}.e-steps span{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.opt small.meta{font-weight:500}
@media (max-width:360px){.e-fields{grid-template-columns:1fr}}
.e-field{min-width:0}.e-field input{width:100%}

/* =====================================================================
   v12 · Shallow navigation in the Blue Frost · brown · white palette
   ===================================================================== */
/* ask: intent-first search */
.ask{display:flex;flex-direction:column;gap:10px}
.ask .t-hero{margin:0}
.ask-field{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line),var(--sh-1);color:var(--ink-3);font-size:15px;text-align:left;transition:transform .15s var(--ease),box-shadow .15s}
.ask-field svg{width:20px;height:20px;color:var(--brand-text);flex:none}
.ask-field span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-field:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.ask-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.ask-chips::-webkit-scrollbar{display:none}
.ask-chips button{flex:none;min-height:34px;padding:0 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:13.5px;transition:transform .15s var(--ease)}
.ask-chips button:active{transform:scale(.95)}
.ask-mini{display:flex;align-items:center;gap:10px;justify-content:center;padding:12px;border-radius:14px;border:1.5px dashed var(--line);color:var(--ink-2);font-size:13.5px;font-weight:600}
.ask-mini svg{width:18px;height:18px}
/* worlds: the 4 top-level choices */
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.world{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:132px;padding:14px;border-radius:20px;background:color-mix(in srgb,var(--c) 17%,var(--surface));color:var(--ink);text-align:left;border:1px solid color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 38%,var(--line));transition:transform .15s var(--ease),box-shadow .15s}
.world:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 38%,var(--line))}
.world-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;flex:none}
.world-ic svg{width:22px;height:22px}
.world-t{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px}
.world-t b{font-size:16px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.world-t span{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.world-deco{position:absolute;right:-14px;top:-10px;width:92px;height:92px;opacity:.14;color:var(--c)}
.world-deco svg{width:100%;height:100%}
